<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kasina + FM Gong Timer (Serene Reverb, No UI)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <style>
    html, body { height: 100%; margin: 0; background:#000; overflow: hidden; }
    .wrap { position: fixed; inset: 0; display: grid; place-items: center; background:#000; overflow: hidden; }
    .scene-root { position: absolute; inset: 0; background: #000; pointer-events: none; }
    .scene-root canvas { display: block; width: 100%; height: 100%; }
    .kasina {
      width: 280px; height: 280px; border-radius: 50%;
      background:
        radial-gradient(circle at 44% 34%, rgba(255,255,255,0.08), rgba(255,255,255,0) 38%),
        radial-gradient(circle, #1765c8 0%, #0b54b9 64%, #08479f 100%);
      box-shadow: 0 0 40px rgba(255,255,255,0.06);
      will-change: transform, background, width, height;
      position: relative;
      z-index: 1;
    }
    .kasina[data-kasina="disk"] .candle-scene,
    .kasina[data-kasina="fire"] .candle-scene { display: none; }
    .kasina[data-kasina="candle"] {
      display: grid;
      place-items: center;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }
    .kasina[data-kasina="disk"] .fire-scene,
    .kasina[data-kasina="candle"] .fire-scene { display: none; }
    .kasina[data-kasina="fire"] {
      display: grid;
      place-items: center;
      border-radius: 50%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 126, 38, 0.92), rgba(156, 22, 12, 0.68) 42%, rgba(18, 5, 18, 0.94) 78%, #050505 100%);
      box-shadow: 0 0 44px rgba(255, 91, 32, 0.12);
    }
    .fire-scene {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 48%, rgba(255, 240, 102, 0.88), rgba(255, 96, 30, 0.42) 24%, rgba(115, 12, 24, 0.28) 50%, rgba(6, 5, 7, 0.94) 82%),
        repeating-linear-gradient(92deg, rgba(255, 206, 77, 0.18) 0 6px, rgba(139, 14, 32, 0.06) 6px 17px, rgba(23, 8, 31, 0.22) 17px 30px);
      filter: saturate(1.16) contrast(1.06);
    }
    .fire-scene::before,
    .fire-scene::after {
      content: "";
      position: absolute;
      inset: -18% -28%;
      border-radius: inherit;
      mix-blend-mode: screen;
      opacity: 0.66;
      background:
        repeating-linear-gradient(101deg, rgba(255, 228, 87, 0.0) 0 11px, rgba(255, 123, 43, 0.34) 11px 19px, rgba(62, 26, 156, 0.18) 19px 34px),
        radial-gradient(ellipse at 42% 58%, rgba(255, 232, 92, 0.82), rgba(219, 57, 20, 0.20) 30%, rgba(18, 10, 23, 0) 62%);
      animation: fireKasinaDrift 18s ease-in-out infinite alternate;
    }
    .fire-scene::after {
      inset: -24% -34%;
      opacity: 0.38;
      transform: rotate(12deg);
      animation-duration: 25s;
      animation-direction: alternate-reverse;
    }
    .kasina[data-kasina="fire"][data-flicker="false"] .fire-scene::before,
    .kasina[data-kasina="fire"][data-flicker="false"] .fire-scene::after {
      animation: none;
    }
    .candle-scene {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .candle-plane {
      position: absolute;
      left: 50%;
      bottom: 12%;
      width: 46%;
      height: 4%;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(20,14,10,0), rgba(66,43,24,0.58) 24%, rgba(96,60,30,0.62) 50%, rgba(66,43,24,0.58) 76%, rgba(20,14,10,0));
      filter: blur(0.2px);
    }
    .candle-body {
      position: absolute;
      left: 50%;
      bottom: 15%;
      width: 27%;
      height: 34%;
      transform: translateX(-50%);
      border-radius: 0 0 9% 9% / 0 0 5% 5%;
      background:
        radial-gradient(ellipse at 48% 8%, rgba(255,244,214,0.36), rgba(255,244,214,0) 42%),
        linear-gradient(90deg, #94846b 0%, #e5dbc1 18%, #f2ead4 46%, #c7b89a 82%, #75664f 100%);
      box-shadow: inset 7px 0 12px rgba(255,255,255,0.12), inset -12px 0 18px rgba(38,26,18,0.28), 0 12px 20px rgba(0,0,0,0.32);
    }
    .candle-top {
      position: absolute;
      left: 50%;
      bottom: 46%;
      width: 27%;
      height: 7.2%;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 50% 54%, rgba(95,70,48,0.24) 0 16%, rgba(242,232,205,0.86) 42%, rgba(149,130,100,0.88) 72%, rgba(87,70,50,0.44) 100%),
        linear-gradient(90deg, rgba(255,255,255,0.18), rgba(255,255,255,0));
      box-shadow: inset 0 4px 7px rgba(45,30,18,0.2), 0 1px 2px rgba(255,244,214,0.12);
    }
    .candle-wick {
      position: absolute;
      left: 50%;
      bottom: 45%;
      width: 2.5%;
      height: 16%;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(#322015, #120d0a);
      box-shadow: 0 0 5px rgba(246,146,49,0.08);
    }
    .candle-flame {
      position: absolute;
      left: 50%;
      bottom: 56%;
      width: 26%;
      height: 34%;
      transform: translateX(-50%);
      border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%;
      background:
        radial-gradient(ellipse at 50% 68%, rgba(255,199,94,0.62) 0 14%, rgba(246,138,42,0.42) 36%, rgba(196,71,24,0.16) 58%, rgba(196,71,24,0) 72%),
        radial-gradient(ellipse at 50% 48%, rgba(255,158,54,0.5) 0 24%, rgba(216,78,22,0.22) 56%, rgba(216,78,22,0) 76%);
      clip-path: polygon(50% 0%, 64% 18%, 75% 42%, 72% 70%, 59% 94%, 50% 100%, 39% 94%, 28% 70%, 25% 42%, 36% 18%);
      opacity: 0.88;
      filter: blur(0.15px);
      transform-origin: 50% 92%;
    }
    .candle-flame::after {
      content: "";
      position: absolute;
      inset: 26% 32% 16%;
      border-radius: 50% 50% 48% 48% / 64% 64% 36% 36%;
      background: radial-gradient(ellipse at 50% 70%, rgba(255,209,116,0.54), rgba(245,157,61,0.26) 58%, rgba(245,157,61,0) 72%);
    }
    .kasina[data-kasina="candle"][data-flicker="true"] .candle-flame {
      animation: candleFlameFlicker 5.8s ease-in-out infinite;
    }
    @keyframes candleFlameFlicker {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.86; }
      24% { transform: translateX(calc(-50% + 4px)) scale(0.94, 1.07); opacity: 0.96; }
      53% { transform: translateX(calc(-50% - 3px)) scale(1.06, 0.95); opacity: 0.78; }
      78% { transform: translateX(calc(-50% + 2px)) scale(0.97, 1.05); opacity: 0.92; }
    }
    @media (prefers-reduced-motion: reduce) {
      .kasina[data-kasina="candle"][data-flicker="true"] .candle-flame {
        animation: none;
      }
      .kasina[data-kasina="fire"] .fire-scene::before,
      .kasina[data-kasina="fire"] .fire-scene::after {
        animation: none;
      }
    }
    @keyframes fireKasinaDrift {
      0% { transform: translate3d(-3%, 1%, 0) scale(1.03) rotate(-2deg); }
      45% { transform: translate3d(2%, -1%, 0) scale(1.08) rotate(3deg); }
      100% { transform: translate3d(4%, 2%, 0) scale(1.04) rotate(-1deg); }
    }
    .wrap[data-renderer="three"] .kasina { opacity: 0; visibility: hidden; }
    .wrap[data-renderer="fallback"] .scene-root { display: none; }
    .practice-hud {
      --lead-fade-ms: 3000ms;
      position: fixed;
      inset: 0;
      z-index: 5;
      color: #f4efe3;
      font: 650 14px/1.1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      opacity: 1;
      transition: opacity var(--lead-fade-ms) linear;
    }
    .practice-hud[data-state="lead"],
    .practice-hud[data-state="hidden"] {
      opacity: 0;
    }
    .practice-hud[data-state="hidden"] {
      pointer-events: none;
      transition-duration: 180ms;
    }
    .practice-hud button {
      appearance: none;
      display: grid;
      place-items: center;
      min-height: 40px;
      border: 1px solid rgba(228, 223, 208, 0.22);
      border-radius: 8px;
      background: rgba(18, 21, 20, 0.68);
      color: inherit;
      box-shadow: 0 10px 26px rgba(0,0,0,0.22);
      cursor: pointer;
      font: inherit;
    }
    .practice-hud button:focus-visible {
      outline: 2px solid #8aa1d6;
      outline-offset: 3px;
    }
    .practice-hud-icon {
      position: absolute;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: inherit;
      line-height: 1;
    }
    .practice-hud-settings {
      left: 15%;
      top: 80%;
      transform: translate(-50%, -50%);
    }
    .practice-hud-info {
      right: 15%;
      top: 80%;
      transform: translate(50%, -50%);
    }
    .practice-hud-controls {
      position: absolute;
      left: max(20px, env(safe-area-inset-left));
      right: max(20px, env(safe-area-inset-right));
      bottom: max(22px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: minmax(96px, 1fr) minmax(112px, 1.2fr) minmax(78px, 1fr);
      gap: 12px;
      align-items: end;
      max-width: 620px;
      margin: 0 auto;
    }
    .practice-hud-primary {
      min-height: 54px;
      background: rgba(228, 223, 208, 0.94) !important;
      color: #101110 !important;
      font-size: 18px !important;
    }
    .practice-hud-time {
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 560px) {
      .practice-hud {
        font-size: 12px;
      }
      .practice-hud-controls {
        grid-template-columns: minmax(82px, 1fr) minmax(96px, 1.15fr) minmax(66px, 1fr);
        gap: 8px;
        left: 14px;
        right: 14px;
        bottom: max(14px, env(safe-area-inset-bottom));
      }
      .practice-hud button {
        min-height: 36px;
      }
      .practice-hud-primary {
        min-height: 48px;
        font-size: 16px !important;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="wrap" data-renderer="fallback">
    <div class="scene-root" id="scene-root" aria-hidden="true"></div>
    <div class="kasina" id="kasina" data-kasina="disk">
      <div class="candle-scene" aria-hidden="true">
        <div class="candle-plane"></div>
        <div class="candle-body"></div>
        <div class="candle-top"></div>
        <div class="candle-wick"></div>
        <div class="candle-flame"></div>
      </div>
      <div class="fire-scene" aria-hidden="true"></div>
    </div>
  </div>
  <div class="practice-hud" id="practice-hud" data-state="idle" aria-label="Practice controls">
    <button class="practice-hud-icon practice-hud-settings" type="button" aria-label="Open settings">f</button>
    <button class="practice-hud-icon practice-hud-info" type="button" aria-label="Open meditation instructions">j</button>
    <div class="practice-hud-controls">
      <button id="practice-hud-lead" type="button" aria-label="Lead-in duration">lead in 3s</button>
      <button id="practice-hud-action" class="practice-hud-primary" type="button">Space</button>
      <button id="practice-hud-duration" class="practice-hud-time" type="button" aria-label="Session duration">10:00</button>
    </div>
  </div>

<script>
(() => {
  const readParams = () => Object.fromEntries(new URLSearchParams(location.search));
  let activeParams = readParams();
  const q = (k, d='') => ((activeParams[k] ?? d)).trim();
  let THREE = null;
  let activeScene = null;
  const presetColors = {
    blue:'#1E397A',
    red:'#B8322A',
    yellow:'#F2C230',
    white:'#E4DFD0',
    cobalt:'#0047AB',
    amaranth:'#C41E3A',
    crimson:'#DC143C',
    azure:'#007FFF',
    steel:'#4682B4',
  };
  const cameraDistance = 7.0;
  const cameraFovDegrees = 36;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const expandHex = (hex) =>
    hex.length === 4
      ? `#${hex[1]}${hex[1]}${hex[2]}${hex[2]}${hex[3]}${hex[3]}`.toUpperCase()
      : hex.toUpperCase();

  const resolveKasinaColor = (value) => {
    const color = value.trim();
    return /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(color)
      ? expandHex(color)
      : (presetColors[color.toLowerCase()] || '#0047AB');
  };

  const kasinaKinds = new Set(['disk', 'candle', 'fire']);
  const resolveKasinaKind = (value) => {
    const kind = value.trim().toLowerCase();
    return kasinaKinds.has(kind) ? kind : 'disk';
  };

  const resolveCandleFlicker = (value) =>
    value.trim() !== '0' && !reducedMotion;
  const resolveVisualMotion = resolveCandleFlicker;

  const resolveBackgroundColor = (value) =>
    /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(value) ? expandHex(value) : '#000000';

  const cssLength = (value, fallback) => {
    const trimmed = value.trim();
    if (!trimmed) return fallback;
    if (/^0?\.\d+$/.test(trimmed)) return `${Number(trimmed) * 100}vw`;
    if (/^\d+(?:\.\d+)?$/.test(trimmed)) return `${trimmed}px`;
    return trimmed;
  };

  const resolveRendererMode = (value) => {
    const mode = value.trim().toLowerCase();
    return mode === 'css' || mode === 'three' ? mode : 'auto';
  };

  const probeWebGl = () => {
    const canvas = document.createElement('canvas');
    const attributes = { alpha: false, antialias: false, failIfMajorPerformanceCaveat: true };
    const gl = canvas.getContext('webgl2', attributes) || canvas.getContext('webgl', attributes);
    const supported = !!gl;
    if (gl) {
      const extension = gl.getExtension('WEBGL_lose_context');
      if (extension) extension.loseContext();
    }
    return supported;
  };

  const applyFallbackVisuals = () => {
    const wrap = document.querySelector('.wrap');
    const root = document.getElementById('scene-root');
    const fallbackDisk = document.getElementById('kasina');
    if (!(wrap && root && fallbackDisk)) return;

    const kasinaKind = resolveKasinaKind(q('kasina','disk'));
    const candleFlicker = resolveCandleFlicker(q('flicker','1'));
    const kasinaColor = resolveKasinaColor(q('color',''));
    const bgColor = resolveBackgroundColor(q('bg'));
    const diameter = cssLength(q('d','280px'), '280px');
    fallbackDisk.dataset.kasina = kasinaKind;
    fallbackDisk.dataset.flicker = String((kasinaKind === 'candle' || kasinaKind === 'fire') && candleFlicker);
    fallbackDisk.style.background = kasinaKind === 'disk' ? kasinaColor : '';
    fallbackDisk.style.width = diameter;
    fallbackDisk.style.height = diameter;
    document.body.style.background = bgColor;
    wrap.style.background = bgColor;
    root.style.background = bgColor;
  };

  const hexToRgb = (hex) => ({
    r: parseInt(hex.slice(1, 3), 16),
    g: parseInt(hex.slice(3, 5), 16),
    b: parseInt(hex.slice(5, 7), 16),
  });

  const clampByte = (value) => Math.max(0, Math.min(255, Math.round(value)));
  const liftChannel = (value, amount) => value + ((255 - value) * amount);
  const brightenRgb = (rgb, amount) => ({
    r: liftChannel(rgb.r, amount),
    g: liftChannel(rgb.g, amount),
    b: liftChannel(rgb.b, amount),
  });

  const seedFromString = (text) =>
    [...text].reduce((seed, char) => ((seed << 5) - seed + char.charCodeAt(0)) >>> 0, 0x6d2b79f5);

  const randomFromSeed = (seed) => {
    let state = seed >>> 0;
    return () => {
      state = (state + 0x6d2b79f5) >>> 0;
      let t = state;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  const diskRadiusFromPixels = (diameterPx, viewportHeight) => {
    const visibleHeight = 2 * Math.tan(THREE.MathUtils.degToRad(cameraFovDegrees / 2)) * cameraDistance;
    return (diameterPx / viewportHeight) * visibleHeight / 2;
  };

  const makeTexture = (canvas, colorSpace) => {
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = colorSpace;
    texture.wrapS = THREE.ClampToEdgeWrapping;
    texture.wrapT = THREE.ClampToEdgeWrapping;
    texture.anisotropy = 4;
    return texture;
  };

  function createPaperColorTexture(hexColor) {
    const size = 512;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const base = brightenRgb(hexToRgb(hexColor), 0.18);
    const rand = randomFromSeed(seedFromString(`paper:${hexColor}`));
    canvas.width = size;
    canvas.height = size;

    const image = ctx.createImageData(size, size);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const i = (y * size + x) * 4;
        const dx = x / size - 0.5;
        const dy = y / size - 0.5;
        const radius = Math.sqrt(dx * dx + dy * dy);
        const fine = (rand() - 0.5) * 8.0;
        const tooth = (rand() - 0.5) * 3.0;
        const fleck = rand() > 0.994 ? (rand() > 0.45 ? 12 : -14) : 0;
        const edge = Math.max(0, radius - 0.42) * 7.0;
        const variation = fine + tooth + fleck - edge;
        image.data[i] = clampByte(base.r + variation);
        image.data[i + 1] = clampByte(base.g + variation);
        image.data[i + 2] = clampByte(base.b + variation);
        image.data[i + 3] = 255;
      }
    }
    ctx.putImageData(image, 0, 0);

    for (let i = 0; i < 900; i++) {
      const alpha = 0.018 + rand() * 0.026;
      const tone = rand() > 0.52 ? 255 : 0;
      const radius = 0.22 + rand() * 0.9;
      ctx.fillStyle = `rgba(${tone},${tone},${tone},${alpha})`;
      ctx.beginPath();
      ctx.arc(rand() * size, rand() * size, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    return makeTexture(canvas, THREE.SRGBColorSpace);
  }

  function createPaperBumpTexture(hexColor) {
    const size = 256;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const rand = randomFromSeed(seedFromString(`bump:${hexColor}`));
    canvas.width = size;
    canvas.height = size;

    const image = ctx.createImageData(size, size);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const i = (y * size + x) * 4;
        const grain = (rand() - 0.5) * 22;
        const pore = rand() > 0.985 ? (rand() - 0.5) * 34 : 0;
        const value = clampByte(128 + grain + pore);
        image.data[i] = value;
        image.data[i + 1] = value;
        image.data[i + 2] = value;
        image.data[i + 3] = 255;
      }
    }
    ctx.putImageData(image, 0, 0);

    return makeTexture(canvas, THREE.NoColorSpace);
  }

  function createDisk(hexColor) {
    const faceTexture = createPaperColorTexture(hexColor);
    const bumpTexture = createPaperBumpTexture(hexColor);
    const baseColor = new THREE.Color(hexColor);
    const sideColor = baseColor.clone().lerp(new THREE.Color(0xffffff), 0.08).multiplyScalar(0.68);
    const backColor = baseColor.clone().lerp(new THREE.Color(0xffffff), 0.06).multiplyScalar(0.52);

    const faceMaterial = new THREE.MeshStandardMaterial({
      map: faceTexture,
      bumpMap: bumpTexture,
      bumpScale: 0.010,
      roughness: 0.92,
      metalness: 0,
    });
    const sideMaterial = new THREE.MeshStandardMaterial({
      color: sideColor,
      bumpMap: bumpTexture,
      bumpScale: 0.005,
      roughness: 0.98,
      metalness: 0,
    });
    const backMaterial = new THREE.MeshStandardMaterial({
      color: backColor,
      roughness: 1,
      metalness: 0,
    });

    const mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(1, 1, 1, 160, 1, false),
      [sideMaterial, faceMaterial, backMaterial]
    );
    mesh.rotation.x = Math.PI / 2;
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    const group = new THREE.Group();
    group.add(mesh);
    return group;
  }

  function createCandleFlameMaterial() {
    return new THREE.ShaderMaterial({
      transparent: false,
      depthWrite: false,
      depthTest: false,
      side: THREE.DoubleSide,
      blending: THREE.NormalBlending,
      uniforms: {
        uTime: { value: 0 },
        uMotion: { value: reducedMotion ? 0 : 1 },
        uFlicker: { value: 0 },
        uBrightness: { value: 1 },
      },
      vertexShader: `
        varying vec2 vUv;

        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uMotion;
        uniform float uFlicker;
        uniform float uBrightness;
        varying vec2 vUv;

        float flameBody(float width, float edge, vec2 uv) {
          float y = uv.y;
          float taper = mix(width, width * 0.24, smoothstep(0.10, 0.96, y));
          float side = 1.0 - smoothstep(taper, taper + edge, abs(uv.x - 0.5));
          float bottom = smoothstep(0.02, 0.16, y);
          float top = 1.0 - smoothstep(0.82, 1.0, y + abs(uv.x - 0.5) * 0.52);
          return side * bottom * top;
        }

        void main() {
          float y = vUv.y;
          float slowDrift = (sin(uTime * 0.38 + y * 2.7) * 0.016 + uFlicker * 0.05) * uMotion;
          float heightBreath = 1.0 + uFlicker * 0.065 * uMotion;
          vec2 uv = vec2(vUv.x - slowDrift, y * heightBreath);
          float outer = flameBody(0.255, 0.065, uv);
          float middle = flameBody(0.175, 0.045, vec2(uv.x, uv.y * 0.98 + 0.035));
          float core = flameBody(0.095, 0.035, vec2(uv.x, uv.y * 0.94 + 0.10));
          float verticalFalloff = 1.0 - smoothstep(0.72, 1.0, y);
          float alpha = clamp((outer * 0.52 + middle * 0.28 + core * 0.22) * verticalFalloff * (0.96 + uFlicker * 0.12), 0.0, 0.74);
          vec3 ember = vec3(0.66, 0.19, 0.055);
          vec3 amber = vec3(0.95, 0.43, 0.11);
          vec3 warm = vec3(1.0, 0.67, 0.30);
          vec3 color = mix(ember, amber, clamp(middle + y * 0.16, 0.0, 1.0));
          color = mix(color, warm, clamp(core * 0.62, 0.0, 1.0));
          gl_FragColor = vec4(color * uBrightness, alpha);
        }
      `,
    });
  }

  function createCandleBody() {
    const group = new THREE.Group();
    const waxMaterial = new THREE.MeshStandardMaterial({
      color: 0xeadfc6,
      roughness: 0.86,
      metalness: 0,
      emissive: 0x1f1207,
      emissiveIntensity: 0.035,
    });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.31, 0.34, 0.92, 96, 1, false), waxMaterial);
    body.position.set(0, -0.61, 0);
    body.castShadow = true;
    body.receiveShadow = true;
    group.add(body);

    const sideShade = new THREE.Mesh(
      new THREE.CylinderGeometry(0.314, 0.344, 0.9, 96, 1, true, Math.PI * 0.08, Math.PI * 0.34),
      new THREE.MeshBasicMaterial({
        color: 0x6f5d48,
        transparent: true,
        opacity: 0.16,
        depthWrite: false,
        side: THREE.DoubleSide,
      })
    );
    sideShade.position.copy(body.position);
    group.add(sideShade);
    return group;
  }

  function createCandleTop() {
    const group = new THREE.Group();
    const topMaterial = new THREE.MeshStandardMaterial({
      color: 0xf1e6cd,
      roughness: 0.92,
      metalness: 0,
      emissive: 0x3c1907,
      emissiveIntensity: 0.08,
    });
    const top = new THREE.Mesh(new THREE.CylinderGeometry(0.31, 0.29, 0.052, 96, 1, false), topMaterial);
    top.position.set(0, -0.13, 0);
    top.castShadow = true;
    top.receiveShadow = true;
    group.add(top);

    const meltWell = new THREE.Mesh(
      new THREE.CylinderGeometry(0.115, 0.14, 0.012, 64, 1, false),
      new THREE.MeshStandardMaterial({
        color: 0xcab999,
        roughness: 0.98,
        metalness: 0,
        emissive: 0x261006,
        emissiveIntensity: 0.05,
      })
    );
    meltWell.position.set(0, -0.097, 0);
    group.add(meltWell);

    const rim = new THREE.Mesh(
      new THREE.TorusGeometry(0.307, 0.014, 12, 96),
      new THREE.MeshStandardMaterial({
        color: 0xd5c7a9,
        roughness: 0.9,
        metalness: 0,
      })
    );
    rim.rotation.x = Math.PI / 2;
    rim.position.set(0, -0.1, 0);
    group.add(rim);

    const topFace = new THREE.Mesh(
      new THREE.CircleGeometry(0.31, 96),
      new THREE.MeshStandardMaterial({
        color: 0xe8ddc4,
        roughness: 0.94,
        metalness: 0,
        emissive: 0x3a1706,
        emissiveIntensity: 0.055,
        transparent: true,
        opacity: 0.92,
        side: THREE.DoubleSide,
      })
    );
    topFace.scale.y = 0.24;
    topFace.position.set(0, -0.106, 0.318);
    group.add(topFace);
    return group;
  }

  const candleFlickerValue = (elapsed, enabled) => {
    if (!enabled) return 0;
    const value =
      Math.sin(elapsed * 1.31) * 0.46 +
      Math.sin(elapsed * 2.17 + 1.4) * 0.32 +
      Math.sin(elapsed * 0.63 + 0.7) * 0.22;
    return Math.max(-1, Math.min(1, value));
  };

  function createCandleKasina({ flicker = true } = {}) {
    const group = new THREE.Group();
    const baseMaterial = new THREE.MeshBasicMaterial({
      color: 0x5a361e,
      transparent: true,
      opacity: 0.28,
      depthWrite: false,
    });
    const basePlane = new THREE.Mesh(new THREE.PlaneGeometry(1.42, 0.11), baseMaterial);
    basePlane.position.set(0, -1.08, -0.02);
    group.add(basePlane);

    const candleBody = createCandleBody();
    group.add(candleBody);

    const candleTop = createCandleTop();
    group.add(candleTop);

    const wickMaterial = new THREE.MeshBasicMaterial({ color: 0x21140d });
    const wick = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.023, 0.34, 20), wickMaterial);
    wick.rotation.z = -0.08;
    wick.position.set(0.012, 0.06, 0.018);
    group.add(wick);

    const flameMaterial = createCandleFlameMaterial();
    const flame = new THREE.Mesh(new THREE.PlaneGeometry(0.54, 0.94, 1, 1), flameMaterial);
    flame.position.set(0, 0.48, 0.04);
    group.add(flame);

    const flameLight = new THREE.PointLight(0xff8f32, 1.1, 2.4, 1.8);
    flameLight.position.set(0, 0.43, 0.32);
    group.add(flameLight);

    group.userData.animatedMaterials = [flameMaterial];
    group.userData.animatedLights = [flameLight];
    group.userData.flicker = flicker;
    return group;
  }

  function createFireLineMaterial({ motion = true } = {}) {
    return new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      depthTest: true,
      side: THREE.DoubleSide,
      blending: THREE.NormalBlending,
      extensions: { derivatives: true },
      uniforms: {
        uTime: { value: 0 },
        uMotion: { value: motion ? 1 : 0 },
      },
      vertexShader: `
        varying vec2 vUv;

        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uMotion;
        varying vec2 vUv;

        float rand(vec2 n) {
          return fract(sin(cos(dot(n, vec2(12.9898, 12.1414)))) * 83758.5453);
        }

        float noise(vec2 n) {
          const vec2 d = vec2(0.0, 1.0);
          vec2 b = floor(n);
          vec2 f = smoothstep(vec2(0.0), vec2(1.0), fract(n));

          return mix(
            mix(rand(b), rand(b + d.yx), f.x),
            mix(rand(b + d.xy), rand(b + d.yy), f.x),
            f.y
          );
        }

        float fbm(vec2 n) {
          float total = 0.0;
          float amplitude = 1.0;

          for (int i = 0; i < 20; i++) {
            total += noise(n) * amplitude;
            n += n * 1.7;
            amplitude *= 0.47;
          }

          return total;
        }

        vec3 fireLine(vec2 fragCoord, vec2 res, float time) {
          const vec3 c1 = vec3(0.5, 0.0, 0.1);
          const vec3 c2 = vec3(0.9, 0.1, 0.0);
          const vec3 c3 = vec3(0.2, 0.1, 0.7);
          const vec3 c4 = vec3(1.0, 0.9, 0.1);
          const vec3 c5 = vec3(0.1);
          const vec3 c6 = vec3(0.9);

          vec2 uv = fragCoord.xy / res.xy;
          vec2 speed = vec2(0.1, 0.9);
          float shift = 1.327 + sin(time * 2.0) / 2.4;
          float dist = 3.5 - sin(time * 0.4) / 1.89;
          vec2 p = fragCoord.xy * dist / res.xx;

          p += sin(p.yx * 4.0 + vec2(0.2, -0.3) * time) * 0.04;
          p += sin(p.yx * 8.0 + vec2(0.6,  0.1) * time) * 0.01;
          p.x -= time / 1.1;

          float q  = fbm(p - vec2(time * 0.3)  + vec2(1.0  * sin(time + 0.5) / 2.0));
          float qb = fbm(p - vec2(time * 0.4)  + vec2(0.1  * cos(time) / 2.0));
          float q2 = fbm(p - vec2(time * 0.44) - vec2(5.0  * cos(time) / 2.0))  - 6.0;
          float q3 = fbm(p - vec2(time * 0.9)  - vec2(10.0 * cos(time) / 15.0)) - 4.0;
          float q4 = fbm(p - vec2(time * 1.4)  - vec2(20.0 * sin(time) / 14.0)) + 2.0;

          q = (q + qb - 0.4 * q2 - 2.0 * q3 + 0.6 * q4) / 3.8;

          vec2 r = vec2(
            fbm(p + vec2(q / 2.0 + time * speed.x - p.x - p.y)),
            fbm(p + vec2(q - time * speed.y))
          );

          vec3 c = mix(c1, c2, fbm(p + r))
                 + mix(c3, c4, r.x)
                 - mix(c5, c6, r.y);

          vec3 color = 1.0 / pow(c + 1.61, vec3(4.0))
                     * cos(shift * fragCoord.y / res.y);

          float flameRise = 0.35;
          color = vec3(1.0, 0.2, 0.05)
                / pow((r.y + r.y) * max(0.0, p.y) * flameRise + 0.1, 4.0);

          vec3 emberTexture = vec3(fbm(uv * 4.0 + vec2(time * 0.025, -time * 0.012)));
          color += (
            emberTexture
            * 0.01
            * pow((r.y + r.y) * 0.65, 5.0)
            + 0.055
          ) * mix(
            vec3(0.9, 0.4, 0.3),
            vec3(0.7, 0.5, 0.2),
            uv.y
          );

          color = color / (1.0 + max(vec3(0.0), color));
          return color;
        }

        void main() {
          float time = uTime * uMotion;
          vec2 diskPos = (vUv - 0.5) * 2.0;
          float d = length(diskPos);
          float aa = max(fwidth(d), 0.001);
          float diskMask = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, d);

          vec2 localUv = diskPos * 0.5 + 0.5;
          vec2 localRes = vec2(1024.0, 576.0);
          vec2 localFragCoord = localUv * localRes;
          vec3 fire = fireLine(localFragCoord, localRes, time);
          float edgeVignette = 1.0 - 0.22 * smoothstep(0.72, 1.0, d);
          fire *= edgeVignette;

          float grain = rand(floor(vUv * 1024.0));
          vec3 bg = vec3(0.006 + grain * 0.018);
          gl_FragColor = vec4(mix(bg, fire, diskMask), 1.0);
        }
      `,
    });
  }

  function createFireKasina({ motion = true } = {}) {
    const material = createFireLineMaterial({ motion });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2, 1, 1), material);
    mesh.position.z = 0.035;

    const group = new THREE.Group();
    group.add(mesh);
    group.userData.animatedMaterials = [material];
    group.userData.fireMotion = motion;
    return group;
  }

  const createKasinaObject = (kind, hexColor, { flicker = true } = {}) =>
    kind === 'candle'
      ? createCandleKasina({ flicker })
      : kind === 'fire'
        ? createFireKasina({ motion: flicker })
        : createDisk(hexColor);

  function createHazeMaterial(opacity) {
    return new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      depthTest: true,
      side: THREE.DoubleSide,
      blending: THREE.NormalBlending,
      uniforms: {
        uTime: { value: 0 },
        uOpacity: { value: opacity },
        uTint: { value: new THREE.Color(0xaeb3b8) },
      },
      vertexShader: `
        varying vec2 vUv;

        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uOpacity;
        uniform vec3 uTint;
        varying vec2 vUv;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);

          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }

        float fbm(vec2 p) {
          float value = 0.0;
          float amplitude = 0.5;
          for (int i = 0; i < 4; i++) {
            value += amplitude * noise(p);
            p *= 2.02;
            amplitude *= 0.5;
          }
          return value;
        }

        void main() {
          vec2 centered = vUv - 0.5;
          vec2 drift = vec2(uTime * 0.0022, -uTime * 0.0016);
          float field = fbm(vUv * 2.05 + drift);
          float veil = smoothstep(0.42, 0.88, field);
          float diskQuiet = smoothstep(0.18, 0.42, length(centered));
          float fieldFalloff = 1.0 - smoothstep(0.58, 0.86, length(centered));
          float lowerAir = smoothstep(-0.56, 0.22, centered.y);
          float alpha = veil * diskQuiet * fieldFalloff * lowerAir * uOpacity;
          gl_FragColor = vec4(uTint, alpha);
        }
      `,
    });
  }

  function initKasinaScene() {
    const wrap = document.querySelector('.wrap');
    const root = document.getElementById('scene-root');
    const fallbackDisk = document.getElementById('kasina');
    if (!(wrap && root && fallbackDisk)) throw new Error('Kasina visual mount is missing.');

    let kasinaKind = resolveKasinaKind(q('kasina','disk'));
    let visualMotion = resolveVisualMotion(q('flicker','1'));
    let kasinaColor = resolveKasinaColor(q('color',''));
    let bgColor = resolveBackgroundColor(q('bg'));
    let diameter = cssLength(q('d','280px'), '280px');
    fallbackDisk.dataset.kasina = kasinaKind;
    fallbackDisk.dataset.flicker = String((kasinaKind === 'candle' || kasinaKind === 'fire') && visualMotion);
    fallbackDisk.style.background = kasinaKind === 'disk' ? kasinaColor : '';
    fallbackDisk.style.width = diameter;
    fallbackDisk.style.height = diameter;
    document.body.style.background = bgColor;
    wrap.style.background = bgColor;
    root.style.background = bgColor;

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setClearColor(bgColor, 1);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(bgColor);
    scene.fog = new THREE.FogExp2(bgColor, 0.035);

    const camera = new THREE.PerspectiveCamera(cameraFovDegrees, window.innerWidth / window.innerHeight, 0.1, 40);
    camera.position.set(0, 0, cameraDistance);
    camera.lookAt(0, 0, 0);

    let visualObject = createKasinaObject(kasinaKind, kasinaColor, { flicker: visualMotion });
    scene.add(visualObject);

    const roomMaterial = new THREE.MeshStandardMaterial({
      color: new THREE.Color(bgColor).lerp(new THREE.Color(0x050504), 0.92),
      roughness: 1,
      metalness: 0,
    });
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(24, 14), roomMaterial);
    backWall.position.set(0, 0, -1.8);
    backWall.receiveShadow = true;
    scene.add(backWall);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 14), roomMaterial.clone());
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, -3.05, 1.4);
    floor.receiveShadow = true;
    scene.add(floor);

    scene.add(new THREE.AmbientLight(0x151515, 0.86));

    const keyLight = new THREE.SpotLight(0xfff7df, 22, 12, 0.54, 0.94, 1.4);
    keyLight.position.set(-1.55, 2.15, 4.75);
    keyLight.target.position.set(0, -0.03, -0.55);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    keyLight.shadow.camera.near = 2;
    keyLight.shadow.camera.far = 9;
    keyLight.shadow.radius = 6;
    scene.add(keyLight, keyLight.target);

    const fillLight = new THREE.DirectionalLight(0x718bb4, 0.32);
    fillLight.position.set(3.5, 1.2, 5);
    scene.add(fillLight);

    const hazeMaterials = [createHazeMaterial(0.014), createHazeMaterial(0.009)];
    const hazeNear = new THREE.Mesh(new THREE.PlaneGeometry(11.5, 6.8), hazeMaterials[0]);
    hazeNear.position.set(0, 0, -0.34);
    scene.add(hazeNear);

    const hazeFar = new THREE.Mesh(new THREE.PlaneGeometry(14, 8.2), hazeMaterials[1]);
    hazeFar.position.set(0.12, -0.05, -1.08);
    scene.add(hazeFar);

    const resize = () => {
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      const rect = fallbackDisk.getBoundingClientRect();
      const diameterPx = Math.max(80, Math.min(Math.max(window.innerWidth, window.innerHeight), rect.width || 280));
      const radius = diskRadiusFromPixels(diameterPx, window.innerHeight);
      visualObject.position.y = Math.min(0.34, Math.max(0.08, radius * 0.12));
      if (kasinaKind === 'candle') {
        visualObject.scale.set(radius, radius, radius);
      } else if (kasinaKind === 'fire') {
        visualObject.scale.set(radius, radius, 1);
      } else {
        visualObject.scale.set(radius, radius, Math.max(0.036, radius * 0.074));
      }
    };

    const disposeObject = (object) => {
      object.traverse((node) => {
        if (!node.isMesh) return;
        node.geometry.dispose();
        const materials = Array.isArray(node.material) ? node.material : [node.material];
        materials.forEach((material) => {
          ['map', 'bumpMap', 'normalMap', 'roughnessMap', 'metalnessMap'].forEach((key) => {
            if (material[key]) material[key].dispose();
          });
          material.dispose();
        });
      });
    };

    const disposeScene = () => {
      renderer.setAnimationLoop(null);
      window.removeEventListener('resize', resize);
      disposeObject(scene);
      renderer.dispose();
      renderer.forceContextLoss();
      renderer.domElement.remove();
      wrap.dataset.renderer = 'fallback';
      activeScene = null;
    };

    const applyVisualSettings = (params) => {
      activeParams = { ...params };
      const nextKasinaKind = resolveKasinaKind(q('kasina','disk'));
      const nextVisualMotion = resolveVisualMotion(q('flicker','1'));
      const nextKasinaColor = resolveKasinaColor(q('color',''));
      const nextBgColor = resolveBackgroundColor(q('bg'));
      const nextDiameter = cssLength(q('d','280px'), '280px');

      fallbackDisk.dataset.kasina = nextKasinaKind;
      fallbackDisk.dataset.flicker = String((nextKasinaKind === 'candle' || nextKasinaKind === 'fire') && nextVisualMotion);
      fallbackDisk.style.background = nextKasinaKind === 'disk' ? nextKasinaColor : '';
      fallbackDisk.style.width = nextDiameter;
      fallbackDisk.style.height = nextDiameter;
      document.body.style.background = nextBgColor;
      wrap.style.background = nextBgColor;
      root.style.background = nextBgColor;
      renderer.setClearColor(nextBgColor, 1);
      scene.background = new THREE.Color(nextBgColor);
      scene.fog.color = new THREE.Color(nextBgColor);
      roomMaterial.color.copy(new THREE.Color(nextBgColor).lerp(new THREE.Color(0x050504), 0.92));
      floor.material.color.copy(roomMaterial.color);

      if (
        nextKasinaKind !== kasinaKind ||
        (nextKasinaKind === 'disk' && nextKasinaColor !== kasinaColor) ||
        ((nextKasinaKind === 'candle' || nextKasinaKind === 'fire') && nextVisualMotion !== visualMotion)
      ) {
        scene.remove(visualObject);
        disposeObject(visualObject);
        visualObject = createKasinaObject(nextKasinaKind, nextKasinaColor, { flicker: nextVisualMotion });
        scene.add(visualObject);
      }

      kasinaKind = nextKasinaKind;
      visualMotion = nextVisualMotion;
      kasinaColor = nextKasinaColor;
      bgColor = nextBgColor;
      diameter = nextDiameter;
      resize();
      render();
    };

    const startedAt = performance.now();
    const render = (now = performance.now()) => {
      const elapsed = reducedMotion ? 0 : (now - startedAt) / 1000;
      hazeMaterials.forEach((material, index) => {
        material.uniforms.uTime.value = elapsed * (0.7 + index * 0.23);
      });
      (visualObject.userData.animatedMaterials || []).forEach((material) => {
        const flicker = candleFlickerValue(elapsed, visualObject.userData.flicker);
        if (material.uniforms.uTime) material.uniforms.uTime.value = elapsed;
        if (material.uniforms.uFlicker) material.uniforms.uFlicker.value = flicker;
        if (material.uniforms.uBrightness) material.uniforms.uBrightness.value = 1.0 + flicker * 0.12;
      });
      (visualObject.userData.animatedLights || []).forEach((light) => {
        const flicker = candleFlickerValue(elapsed, visualObject.userData.flicker);
        light.intensity = 1.05 + flicker * 0.22;
        light.position.x = flicker * 0.045;
      });
      renderer.render(scene, camera);
    };

    root.appendChild(renderer.domElement);
    resize();
    render();
    wrap.dataset.renderer = 'three';
    window.addEventListener('resize', resize);
    renderer.setAnimationLoop(render);

    return { applyVisualSettings, disposeScene };
  }

  const fallBackToCss = (error) => {
    if (error) console.warn('[Kasina Three.js] Falling back to the CSS visual.', error);
    const wrap = document.querySelector('.wrap');
    if (wrap) wrap.dataset.renderer = 'fallback';
    applyFallbackVisuals();
  };

  async function tryInitThreeScene() {
    const rendererMode = resolveRendererMode(q('renderer','auto'));
    if (rendererMode === 'css') {
      fallBackToCss();
      return;
    }
    if (rendererMode === 'auto' && !probeWebGl()) {
      fallBackToCss();
      return;
    }

    try {
      if (!THREE) THREE = await import('three');
      activeScene = initKasinaScene();
    } catch (error) {
      activeScene = null;
      fallBackToCss(error);
    }
  }

  applyFallbackVisuals();
  tryInitThreeScene();

  window.addEventListener('happykasina:settingschange', (event) => {
    activeParams = { ...event.detail.params };
    applyFallbackVisuals();
    const rendererMode = resolveRendererMode(q('renderer','auto'));
    if (rendererMode === 'css' && activeScene) {
      activeScene.disposeScene();
      return;
    }
    if (activeScene) {
      activeScene.applyVisualSettings(event.detail.params);
      return;
    }
    tryInitThreeScene();
  });
})();
</script>

<script>
(() => {
  // =========================
  // URL params & defaults
  // =========================
  const readParams = () => Object.fromEntries(new URLSearchParams(location.search));
  let activeParams = readParams();
  const q = (k, d='') => ((activeParams[k] ?? d)).trim();

  function parseDuration(str, defMs) {
    if (!str) return defMs;
    const s = str.toLowerCase();
    if (/^\d+$/.test(s)) return Number(s) * 1000; // seconds
    let ms = 0, any = false, m;
    const re = /(\d+(?:\.\d+)?)(ms|s|m|h)/g;
    while ((m = re.exec(s))) {
      any = true; const v = parseFloat(m[1]); const u = m[2];
      ms += (u==='ms')? v : (u==='s')? v*1e3 : (u==='m')? v*6e4 : v*36e5;
    }
    return any ? ms : defMs;
  }

  function parseTimerDuration(str, defMs) {
    if (!str) return defMs;
    const s = str.toLowerCase();
    if (/^\d+$/.test(s)) {
      if (s.length <= 2) return Number(s) * 1000;
      const minutes = Number(s.slice(0, -2));
      const seconds = Number(s.slice(-2));
      return ((minutes * 60) + seconds) * 1000;
    }
    return parseDuration(s, defMs);
  }

  function parseAudioDuration(str, defMs) {
    if (!str) return defMs;
    const s = str.toLowerCase();
    if (/^\d+$/.test(s)) return Number(s);
    return parseDuration(s, defMs);
  }

  const maxAudioReverbMs = 12000;
  const clampAudioReverbMs = (ms) => Math.max(0, Math.min(maxAudioReverbMs, ms));

  // Practice timers
  let leadMs = parseTimerDuration(q('lead'), 3_000);
  let mainMs = parseTimerDuration(q('t'),    10*60_000);
  const parseReflectionPeriod = (str, defMs) =>
    str.trim().toLowerCase() === 'off' ? 0 : parseTimerDuration(str, defMs);

  let gapMs  = q('reflection','1') === '0' ? 0 : parseReflectionPeriod(q('gap'), 15_000);
  let reflectionEnabled = gapMs > 0;
  const defaultSoundVolume = 0.45;
  const parseSoundVolume = (value) => Math.max(0, Math.min(1, parseFloat(value || String(defaultSoundVolume))));
  let soundVolume = parseSoundVolume(q('vol'));

  const clampNumber = (min, max, value) => Math.max(min, Math.min(max, value));
  const parseClampedNumber = (value, fallback, min, max) => {
    const parsed = parseFloat(value || '');
    return clampNumber(min, max, Number.isFinite(parsed) ? parsed : fallback);
  };
  const defaultReflectionBellSettings = Object.freeze({
    pitch: 880,
    metal: 1,
    harmony: 0,
  });
  const resolveReflectionBellSettings = () => ({
    pitch: parseClampedNumber(q('bellPitch'), defaultReflectionBellSettings.pitch, 440, 1320),
    metal: parseClampedNumber(q('bellMetal'), defaultReflectionBellSettings.metal, 0, 1),
    harmony: parseClampedNumber(q('bellHarmony'), defaultReflectionBellSettings.harmony, 0, 1),
  });
  const reflectionBellRatio = (harmony) => 2.78 + ((3.0 - 2.78) * harmony);
  const reflectionBellModulationIndex = (metal) => 0.3 + (metal * 1.5);
  let reflectionBellSettings = resolveReflectionBellSettings();

  // Reverb defaults (overridden by preset or URL)
  let revMs  = clampAudioReverbMs(parseAudioDuration(q('reverb'), 500));
  let revMix = Math.max(0, Math.min(1, parseFloat(q('mix') || '0.22')));
  // Chorus flag can be forced by URL
  let chorusForced = q('chorus','').toLowerCase();
  if (chorusForced !== '0' && chorusForced !== '1') chorusForced = '';

  // Visuals
  const presetsColors = {
    blue:'#1E397A',
    red:'#B8322A',
    yellow:'#F2C230',
    white:'#E4DFD0',
    cobalt:'#0047AB',
    amaranth:'#C41E3A',
    crimson:'#DC143C',
    azure:'#007FFF',
    steel:'#4682B4',
  };
  const kasinaEl = document.getElementById('kasina');
  let kasinaColor = '#0047AB';
  let kasinaKind = 'disk';
  let bgColor = '#000000';
  let diameter = '280px';

  const expandHex = (hex) =>
    hex.length === 4
      ? `#${hex[1]}${hex[1]}${hex[2]}${hex[2]}${hex[3]}${hex[3]}`.toUpperCase()
      : hex.toUpperCase();

  const cssLength = (value, fallback) => {
    const trimmed = value.trim();
    if (!trimmed) return fallback;
    if (/^0?\.\d+$/.test(trimmed)) return `${Number(trimmed) * 100}vw`;
    if (/^\d+(?:\.\d+)?$/.test(trimmed)) return `${trimmed}px`;
    return trimmed;
  };

  const kasinaKinds = new Set(['disk', 'candle', 'fire']);
  const resolveKasinaKind = (value) => {
    const kind = value.trim().toLowerCase();
    return kasinaKinds.has(kind) ? kind : 'disk';
  };

  const resolveCandleFlicker = (value) =>
    value.trim() !== '0' && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function applyFallbackVisuals() {
    const colorParam = q('color','');
    kasinaKind = resolveKasinaKind(q('kasina','disk'));
    const candleFlicker = resolveCandleFlicker(q('flicker','1'));
    kasinaColor = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(colorParam)
      ? expandHex(colorParam)
      : (presetsColors[colorParam.toLowerCase()] || '#0047AB');
    bgColor = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(q('bg')) ? expandHex(q('bg')) : '#000000';
    diameter = cssLength(q('d','280px'), '280px');
    kasinaEl.dataset.kasina = kasinaKind;
    kasinaEl.dataset.flicker = String((kasinaKind === 'candle' || kasinaKind === 'fire') && candleFlicker);
    kasinaEl.style.background = kasinaKind === 'disk' ? kasinaColor : '';
    kasinaEl.style.width = diameter;
    kasinaEl.style.height = diameter;
    document.body.style.background = bgColor;
    document.querySelector('.wrap').style.background = bgColor;
  }

  applyFallbackVisuals();

  // =========================
  // WebAudio core
  // =========================
  let audioCtx = null, convolver = null, revWet = null, revDry = null, wetChainIn = null, wetChainOut = null, audioOutput = null;
  let audioActivation = null;

  const publishAudioStatus = (state) => {
    window.dispatchEvent(new CustomEvent('happykasina:audiostatus', { detail: { state } }));
  };

  function createAudioContext() {
    if (audioCtx) return audioCtx;
    const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextConstructor) throw new Error('Web Audio is unavailable in this browser.');
    audioCtx = new AudioContextConstructor();
    audioCtx.addEventListener('statechange', () => {
      if (audioCtx.state === 'interrupted') publishAudioStatus('interrupted');
    });
    return audioCtx;
  }

  function activateAudio() {
    try {
      const ctx = createAudioContext();
      if (ctx.state === 'running') return Promise.resolve(ctx);
      if (ctx.state === 'closed') return Promise.reject(new Error('Audio is no longer available.'));
      if (ctx.state !== 'suspended' && ctx.state !== 'interrupted') {
        return Promise.reject(new Error(`Audio cannot start from state: ${ctx.state}.`));
      }
      if (audioActivation) return audioActivation;
      audioActivation = ctx.resume()
        .then(() => {
          if (ctx.state !== 'running') throw new Error(`Audio did not start (state: ${ctx.state}).`);
          return ctx;
        })
        .catch((error) => {
          console.warn('[Kasina Audio] Could not activate audio.', error);
          throw error;
        })
        .finally(() => { audioActivation = null; });
      return audioActivation;
    } catch (error) {
      return Promise.reject(error);
    }
  }

  function ensureAudioOutput(ctx) {
    if (audioOutput) return audioOutput;
    const bus = ctx.createGain();
    const safety = ctx.createDynamicsCompressor();
    safety.threshold.value = -18;
    safety.knee.value = 18;
    safety.ratio.value = 8;
    safety.attack.value = 0.008;
    safety.release.value = 0.32;
    bus.gain.value = 0.86;
    bus.connect(safety);
    safety.connect(ctx.destination);
    audioOutput = bus;
    return audioOutput;
  }

  // Build a simple stereo convolver impulse (exponential noise tail)
  function buildReverb(ctx, decayMs) {
    const rate = ctx.sampleRate;
    const decaySeconds = Math.max(0.001, decayMs / 1000);
    const length = Math.max(1, Math.floor(rate * decaySeconds));
    const impulse = ctx.createBuffer(2, length, rate);
    for (let ch=0; ch<2; ch++) {
      const data = impulse.getChannelData(ch);
      for (let i=0; i<length; i++) {
        const t = i / rate;
        const decay = Math.exp(-3.5 * t / decaySeconds); // ~60dB over decayMs
        data[i] = (Math.random()*2 - 1) * decay * 0.28;
      }
      // gentle early reflection
      for (let i=0; i<Math.min(200, length-20); i++) {
        data[i+20] += data[i] * 0.22 * (ch===0 ? 1.0 : 0.8);
      }
    }
    const conv = ctx.createConvolver();
    conv.buffer = impulse;
    return conv;
  }

  const defaultChorusCfg = { rateL:0.16, rateR:0.23, depthMs:10, delayMs:18, mix:0.5 };

  const resolveChorusCfg = (cfg = {}) => ({ ...defaultChorusCfg, ...cfg });

  // Build a simple stereo chorus block (post-reverb)
  function buildChorus(ctx, cfg = {}) {
    const { rateL, rateR, depthMs, delayMs, mix } = resolveChorusCfg(cfg);
    const input = ctx.createGain();
    const dry = ctx.createGain();
    const wet  = ctx.createGain();
    const out  = ctx.createGain();

    dry.gain.value = 1 - mix;
    wet.gain.value = mix;

    const splitter = ctx.createChannelSplitter(2);
    const merger   = ctx.createChannelMerger(2);

    const dl = ctx.createDelay(0.05); // 50ms max is plenty
    const dr = ctx.createDelay(0.05);
    const base = delayMs/1000;
    dl.delayTime.value = base;
    dr.delayTime.value = base;

    const lfoL = ctx.createOscillator(); lfoL.type = 'sine'; lfoL.frequency.value = rateL;
    const lfoR = ctx.createOscillator(); lfoR.type = 'sine'; lfoR.frequency.value = rateR;
    const depthL = ctx.createGain(); depthL.gain.value = depthMs/1000;
    const depthR = ctx.createGain(); depthR.gain.value = depthMs/1000;

    // routing
    input.connect(dry);
    input.connect(splitter);
    splitter.connect(dl, 0);
    splitter.connect(dr, 1);
    dl.connect(merger, 0, 0);
    dr.connect(merger, 0, 1);
    merger.connect(wet);

    // LFO modulation of delay times
    lfoL.connect(depthL); depthL.connect(dl.delayTime);
    lfoR.connect(depthR); depthR.connect(dr.delayTime);
    lfoL.start(); lfoR.start();

    // mix to out
    dry.connect(out);
    wet.connect(out);

    return { input, output: out };
  }

  function ensureReverb(ctx, { enableChorus=false, chorusCfg={} } = {}) {
    const output = ensureAudioOutput(ctx);
    if (!convolver) {
      convolver = buildReverb(ctx, revMs);
      revWet = ctx.createGain();
      revDry = ctx.createGain();
      revWet.gain.value = revMix;
      revDry.gain.value = 1 - revMix;

      // Build wet chain: revWet -> convolver -> [optional chorus] -> wetOut -> destination
      const wetOut = ctx.createGain();
      wetOut.connect(output);
      wetChainOut = wetOut;

      if (enableChorus) {
        const ch = buildChorus(ctx, chorusCfg);
        convolver.connect(ch.input);
        ch.output.connect(wetOut);
        wetChainIn = revWet; // we still feed the convolver, not chorus directly
      } else {
        convolver.connect(wetOut);
      }

      // Connect inputs
      revWet.connect(convolver);
      revDry.connect(output);
    }
    return { ctx, convolver, revWet, revDry };
  }

  const previewFadeSeconds = 0.2;
  let activePreviewVoices = [];

  function fadeGainParam(gain, now, fadeSeconds) {
    gain.cancelScheduledValues(now);
    gain.setValueAtTime(Math.max(gain.value, 1e-5), now);
    gain.linearRampToValueAtTime(1e-5, now + fadeSeconds);
  }

  function registerPreviewVoice(ctx, master, sources, stopAt) {
    const voice = { master, sources };
    activePreviewVoices = activePreviewVoices.filter((candidate) => candidate.master.context.state !== 'closed');
    activePreviewVoices.push(voice);
    setTimeout(() => {
      activePreviewVoices = activePreviewVoices.filter((candidate) => candidate !== voice);
    }, Math.max(0, (stopAt - ctx.currentTime + 0.5) * 1000));
  }

  function fadeOutPreviewVoices(fadeSeconds = previewFadeSeconds) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const stopAt = now + fadeSeconds + 0.03;
    const previousWetOut = wetChainOut;
    activePreviewVoices.forEach(({ master, sources }) => {
      fadeGainParam(master.gain, now, fadeSeconds);
      sources.forEach((source) => {
        try { source.stop(stopAt); } catch (error) {}
      });
    });
    if (previousWetOut) {
      fadeGainParam(previousWetOut.gain, now, fadeSeconds);
      setTimeout(() => {
        try { previousWetOut.disconnect(); } catch (error) {}
      }, Math.max(0, (fadeSeconds + 0.05) * 1000));
      convolver = null;
      revWet = null;
      revDry = null;
      wetChainIn = null;
      wetChainOut = null;
    }
    activePreviewVoices = [];
  }

  // Envelopes
  function ampEnv(gainNode, t0, peak, atk, dec) {
    const g = gainNode.gain;
    g.cancelScheduledValues(t0);
    g.setValueAtTime(1e-5, t0);
    g.exponentialRampToValueAtTime(Math.max(peak,1e-4), t0 + atk);
    g.exponentialRampToValueAtTime(1e-5, t0 + atk + dec);
  }
  function indexEnv(gainNode, t0, indexHz, atk, dec) {
    const g = gainNode.gain;
    g.cancelScheduledValues(t0);
    g.setValueAtTime(1e-3, t0);
    g.exponentialRampToValueAtTime(Math.max(indexHz, 1e-3), t0 + atk);
    g.exponentialRampToValueAtTime(1e-3, t0 + atk + dec);
  }

  function fillPinkNoise(data) {
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i=0; i<data.length; i++) {
      const white = Math.random()*2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      b3 = 0.86650 * b3 + white * 0.3104856;
      b4 = 0.55000 * b4 + white * 0.5329522;
      b5 = -0.7616 * b5 - white * 0.0168980;
      data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.08;
      b6 = white * 0.115926;
    }
  }

  // Low, filtered bronze bloom; supports the gong body without becoming a hiss bed.
  function addBronzeBloom(ctx, master, {
    level=0.035, attack=1.2, decay=14.0, hp=55, lp=1800,
    amDepth=0.18, amFreqMin=0.035, amFreqMax=0.11, amJitterEvery=4.0,
    bands=[
      { freq:180, q:1.0, gain:0.9 },
      { freq:430, q:1.1, gain:0.55 },
      { freq:920, q:0.9, gain:0.28 },
    ],
  } = {}, when=0) {
    const t0 = ctx.currentTime + (when||0);

    const noise = ctx.createBufferSource();
    const dur = attack + decay + 2;
    const buf = ctx.createBuffer(2, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    fillPinkNoise(buf.getChannelData(0));
    fillPinkNoise(buf.getChannelData(1));
    noise.buffer = buf; noise.loop = false;

    const resonantSum = ctx.createGain();
    bands.forEach(({ freq, q, gain }) => {
      const band = ctx.createBiquadFilter();
      const bandGain = ctx.createGain();
      band.type = 'bandpass';
      band.frequency.value = freq;
      band.Q.value = q;
      bandGain.gain.value = gain;
      noise.connect(band);
      band.connect(bandGain);
      bandGain.connect(resonantSum);
    });

    const hip = ctx.createBiquadFilter(); hip.type = 'highpass'; hip.frequency.value = hp;
    const lop = ctx.createBiquadFilter(); lop.type = 'lowpass'; lop.frequency.value = lp; lop.Q.value = 0.6;
    const envelope = ctx.createGain(); envelope.gain.value = 0.0;
    const am = ctx.createGain(); am.gain.value = 0.0;

    const base = ctx.createConstantSource(); base.offset.value = Math.max(0.001, 1 - (amDepth / 2));
    const lfo  = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = amFreqMin;
    const depth = ctx.createGain(); depth.gain.value = amDepth / 2;

    lfo.connect(depth);
    depth.connect(am.gain);
    base.connect(am.gain);
    base.start(t0);
    base.stop(t0 + dur + 0.5);

    // Randomize LFO rate over time (slewed)
    function scheduleLfoWander(startT, total) {
      let t = startT, end = startT + total;
      let f = amFreqMin;
      while (t < end) {
        const nextF = amFreqMin + Math.random()*(amFreqMax - amFreqMin);
        lfo.frequency.linearRampToValueAtTime(nextF, t + amJitterEvery);
        t += amJitterEvery;
      }
    }
    scheduleLfoWander(t0, dur);
    lfo.start(t0);
    lfo.stop(t0 + dur + 0.5);

    resonantSum.connect(hip);
    hip.connect(lop);
    lop.connect(envelope);
    envelope.connect(am);
    am.connect(master);

    envelope.gain.setValueAtTime(1e-5, t0);
    envelope.gain.exponentialRampToValueAtTime(Math.max(level,1e-4), t0 + attack);
    envelope.gain.exponentialRampToValueAtTime(1e-5, t0 + attack + decay);

    noise.start(t0);
    noise.stop(t0 + dur + 0.5);
    return [noise, lfo, base];
  }

  // FM gong
  function playFMGong(ctx, {
    when=0, level=0.42, base=220, atk=0.04, dec=6.0, shimmer=true,
    ratioA=2.71, ratioB=4.07, ratioS=9.0, indexA=1.2, indexB=0.72, indexS=0.16,
    aDecay=0.87, bDecay=0.78, sDecay=0.25,
    detuneCents=0, wash=null, preview=false
  } = {}) {
    ensureReverb(ctx, currentWetChain);
    const output = ensureAudioOutput(ctx);
    const t0 = ctx.currentTime + (when||0);

    // Split to dry/wet
    const dry = ctx.createGain();
    const wet = ctx.createGain();
    dry.gain.value = revDry ? revDry.gain.value : 1.0;
    wet.gain.value = revWet ? revWet.gain.value : 0.0;

    dry.connect(output);
    if (revWet && convolver) wet.connect(revWet);

    // Master
    const master = ctx.createGain();
    master.gain.value = level * soundVolume;
    master.connect(dry);
    if (revWet && convolver) master.connect(wet);

    // Carrier
    const c = ctx.createOscillator();
    c.type = 'sine';
    const detune = (Math.random()*2-1) * detuneCents;
    c.frequency.setValueAtTime(base, t0);
    c.detune.setValueAtTime(detune, t0);

    const cAmp = ctx.createGain();
    const tone = ctx.createBiquadFilter();
    tone.type = 'lowpass';
    tone.frequency.setValueAtTime(3600, t0);
    tone.Q.value = 0.55;
    cAmp.gain.value = 0.0;
    c.connect(cAmp);
    cAmp.connect(tone);
    tone.connect(master);
    ampEnv(cAmp, t0, 1.0, atk, dec);

    // Modulator A
    const mA = ctx.createOscillator();
    mA.type = 'sine';
    mA.frequency.setValueAtTime(base * (ratioA + (Math.random()*0.04-0.02)), t0);
    const mAG = ctx.createGain(); mAG.gain.value = 0.0;
    mA.connect(mAG); mAG.connect(c.frequency);
    indexEnv(mAG, t0, base*indexA, Math.max(0.012, atk * 0.45), dec*aDecay);

    // Modulator B
    const mB = ctx.createOscillator();
    mB.type = 'sine';
    mB.frequency.setValueAtTime(base * (ratioB + (Math.random()*0.04-0.02)), t0);
    const mBG = ctx.createGain(); mBG.gain.value = 0.0;
    mB.connect(mBG); mBG.connect(c.frequency);
    indexEnv(mBG, t0, base*indexB, Math.max(0.016, atk * 0.55), dec*bDecay);

    // Shimmer
    let mS, mSG;
    if (shimmer) {
      mS = ctx.createOscillator();
      mS.type = 'sine';
      mS.frequency.setValueAtTime(base * (ratioS + (Math.random()*0.5-0.25)), t0);
      mSG = ctx.createGain(); mSG.gain.value = 0.0;
      mS.connect(mSG); mSG.connect(c.frequency);
      indexEnv(mSG, t0, base*indexS, Math.max(0.02, atk * 0.6), Math.min(1.4, dec*sDecay));
    }

    const bloomSources = wash ? addBronzeBloom(ctx, master, wash, when) : [];

    const stopAt = t0 + dec + 0.8;
    const toneSources = [c, mA, mB, mS].filter(Boolean);
    for (const o of toneSources) { o.start(t0); o.stop(stopAt); }
    if (preview) registerPreviewVoice(ctx, master, [...toneSources, ...bloomSources], stopAt);
  }

  function playFMBell(ctx, {
    when=0, level=0.45, pitch=reflectionBellSettings.pitch,
    metal=reflectionBellSettings.metal, harmony=reflectionBellSettings.harmony,
    atk=0.002, dec=1.1, preview=false
  } = {}) {
    ensureReverb(ctx, currentWetChain);
    const output = ensureAudioOutput(ctx);
    const t0 = ctx.currentTime + (when || 0);
    const dry = ctx.createGain();
    const wet = ctx.createGain();
    dry.gain.value = revDry ? revDry.gain.value : 1.0;
    wet.gain.value = revWet ? revWet.gain.value : 0.0;
    dry.connect(output);
    if (revWet && convolver) wet.connect(revWet);

    const master = ctx.createGain();
    master.gain.value = level * soundVolume;
    master.connect(dry);
    if (revWet && convolver) master.connect(wet);

    const carrier = ctx.createOscillator();
    carrier.type = 'sine';
    carrier.frequency.setValueAtTime(pitch, t0);

    const amp = ctx.createGain();
    amp.gain.setValueAtTime(1e-5, t0);
    amp.gain.exponentialRampToValueAtTime(1, t0 + atk);
    amp.gain.exponentialRampToValueAtTime(1e-4, t0 + atk + dec);

    const mod = ctx.createOscillator();
    mod.type = 'sine';
    mod.frequency.setValueAtTime(pitch * reflectionBellRatio(harmony), t0);
    const modGain = ctx.createGain();
    modGain.gain.setValueAtTime(pitch * reflectionBellModulationIndex(metal), t0);
    modGain.gain.exponentialRampToValueAtTime(1e-4, t0 + dec * 0.72);

    mod.connect(modGain);
    modGain.connect(carrier.frequency);
    carrier.connect(amp);
    amp.connect(master);

    const stopAt = t0 + dec + 0.25;
    carrier.start(t0);
    mod.start(t0);
    carrier.stop(stopAt);
    mod.stop(stopAt);
    if (preview) registerPreviewVoice(ctx, master, [carrier, mod], stopAt);
  }

  // =========================
  // Presets (with longer reverb)
  // =========================
  const PRESETS = {
    'default': {
      label: 'default',
      fm: { base:196, atk:0.045, dec:7.0, shimmer:true, ratioA:2.48, ratioB:3.72, ratioS:8.4, indexA:1.15, indexB:0.62, indexS:0.14, detuneCents:1.2 },
      verb: { revMs: 3000, revMix: 0.2 },
      chorus: { enabled: false }
    },
    'harder-bronze': {
      label: 'harder-bronze',
      fm: { base:174, atk:0.05, dec:8.5, shimmer:false, ratioA:2.28, ratioB:3.58, indexA:1.18, indexB:0.64, sDecay:0.18, detuneCents:1.2 },
      verb: { revMs: 3200, revMix: 0.18 },
      chorus: { enabled: false }
    },
    'temple-bowl': {
      label: 'temple-bowl',
      fm: { base:110, level:0.38, atk:0.06, dec:12.0, shimmer:false, ratioA:2.42, ratioB:3.54, indexA:0.88, indexB:0.42, detuneCents:0.8 },
      verb: { revMs: 5200, revMix: 0.3 },
      chorus: { enabled: true, cfg: { rateL:0.06, rateR:0.09, depthMs:5, delayMs:15, mix:0.16 } }
    },
    'wash': {
      label: 'wash',
      fm: {
        base:87, level:0.4, atk:0.08, dec:16.0, shimmer:true,
        ratioA:2.34, ratioB:3.82, ratioS:8.6, indexA:1.05, indexB:0.58, indexS:0.12,
        aDecay:0.92, bDecay:0.86, detuneCents:1.5,
        wash: {
          level:0.035, attack:1.4, decay:16.0, hp:55, lp:1700,
          amDepth:0.16, amFreqMin:0.035, amFreqMax:0.09, amJitterEvery:4.5,
          bands:[
            { freq:130, q:0.9, gain:0.95 },
            { freq:270, q:1.0, gain:0.72 },
            { freq:610, q:1.1, gain:0.42 },
            { freq:1180, q:0.85, gain:0.2 },
          ],
        },
      },
      verb: { revMs: 7500, revMix: 0.34 },
      chorus: { enabled: true, cfg: { rateL:0.055, rateR:0.08, depthMs:4, delayMs:18, mix:0.14 } }
    }
  };

  let currentWetChain = { enableChorus:false, chorusCfg:{} };

  const normalizePresetName = (name) =>
    name === 'default' ? 'harder-bronze' : name;

  function applyPresetDefaults(name) {
    const p = PRESETS[normalizePresetName(name)] || PRESETS['harder-bronze'];

    // Reverb: preset defaults, then URL overrides
    revMs  = clampAudioReverbMs(parseAudioDuration(q('reverb'), p.verb.revMs));
    revMix = Math.max(0, Math.min(1, parseFloat(q('mix') || String(p.verb.revMix))));

    // Chorus: from preset, optionally forced by URL
    let enableChorus = !!p.chorus.enabled;
    if (chorusForced === '0') enableChorus = false;
    if (chorusForced === '1') enableChorus = true;
    currentWetChain = { enableChorus, chorusCfg: resolveChorusCfg(p.chorus.cfg) };

    // Rebuild graph: tear down convolver so ensureReverb recreates chain with new settings
    if (audioCtx) {
      convolver = null; revWet = null; revDry = null; wetChainIn = null; wetChainOut = null;
    }
    return p;
  }

  // Pick preset from URL
  let presetName = normalizePresetName(q('preset','harder-bronze'));
  let currentPreset = applyPresetDefaults(presetName);

  function logRuntimeSettings() {
    console.log('[FM Gong Timer]', {
      leadMs, mainMs, gapMs, reflectionEnabled, volume: soundVolume, reverb: revMs, mix: revMix, color: kasinaColor, bg: bgColor, diameter, preset: presetName,
      chorus: currentWetChain.enableChorus
    });
  }

  function applyRuntimeSettings(params) {
    activeParams = { ...params };
    leadMs = parseTimerDuration(q('lead'), 3_000);
    mainMs = parseTimerDuration(q('t'), 10*60_000);
    gapMs = q('reflection','1') === '0' ? 0 : parseReflectionPeriod(q('gap'), 15_000);
    reflectionEnabled = gapMs > 0;
    soundVolume = parseSoundVolume(q('vol'));
    reflectionBellSettings = resolveReflectionBellSettings();
    chorusForced = q('chorus','').toLowerCase();
    if (chorusForced !== '0' && chorusForced !== '1') chorusForced = '';
    applyFallbackVisuals();
    presetName = normalizePresetName(q('preset','harder-bronze'));
    currentPreset = applyPresetDefaults(presetName);
    logRuntimeSettings();
  }

  window.addEventListener('happykasina:settingschange', (event) => applyRuntimeSettings(event.detail.params));
  window.addEventListener('happykasina:previewgong', (event) => {
    applyRuntimeSettings({ ...activeParams, ...event.detail.params });
    previewPresetGong();
  });
  window.addEventListener('happykasina:previewbell', (event) => {
    applyRuntimeSettings({ ...activeParams, ...event.detail.params });
    previewBell();
  });

  // Helper: trigger the gong with current preset
  function triggerPresetGong(ctx, extra = {}, options = {}) {
    const fm = { ...currentPreset.fm, ...extra, preview: !!options.preview };
    playFMGong(ctx, fm);
  }

  let previewRequest = 0;

  function handleAudioActivationFailure() {
    publishAudioStatus(audioCtx && audioCtx.state === 'interrupted' ? 'interrupted' : 'unavailable');
  }

  function previewPresetGong(extra = {}) {
    const request = ++previewRequest;
    fadeOutPreviewVoices();
    activateAudio()
      .then((ctx) => {
        if (request === previewRequest) triggerPresetGong(ctx, extra, { preview:true });
      })
      .catch(handleAudioActivationFailure);
  }

  function previewBell() {
    const request = ++previewRequest;
    fadeOutPreviewVoices();
    activateAudio()
      .then((ctx) => {
        if (request === previewRequest) playFMBell(ctx, { preview:true });
      })
      .catch(handleAudioActivationFailure);
  }

  // =========================
  // Timers / controls
  // =========================
  let running = false, audioStarting = false, sequenceRequest = 0, leadTimer=null, mainTimer=null;

  const publishTimerState = (state) => {
    window.dispatchEvent(new CustomEvent('happykasina:timerstate', {
      detail: { state, leadMs, mainMs }
    }));
  };

  function clearAll() {
    if (leadTimer) clearTimeout(leadTimer);
    if (mainTimer) clearTimeout(mainTimer);
    leadTimer = mainTimer = null;
  }

  function startSequence() {
    if (running || audioStarting) return;
    const request = ++sequenceRequest;
    audioStarting = true;
    activateAudio()
      .then((ctx) => {
        if (request !== sequenceRequest) return;
        audioStarting = false;
        running = true;
        ensureReverb(ctx, currentWetChain);
        publishTimerState('lead');

        // Lead-in → intro hit
        leadTimer = setTimeout(() => {
          leadTimer = null;
          publishTimerState('running');
          const introExtra = (presetName === 'wash')
            ? { level:0.32, dec: currentPreset.fm.dec * 0.55, shimmer:false }
            : { level:0.34,  dec: Math.max(4.0, currentPreset.fm.dec * 0.55), shimmer:false };
          triggerPresetGong(ctx, introExtra);

          // After main → two end gongs
          mainTimer = setTimeout(() => {
            mainTimer = null;
            triggerPresetGong(ctx, { base: Math.max(40, (currentPreset.fm.base * 0.89)|0), level:0.42 });
            if (reflectionEnabled) setTimeout(() => playFMBell(ctx), gapMs);
            running = false;
            publishTimerState('idle');
          }, mainMs);
        }, leadMs);
      })
      .catch(() => {
        if (request !== sequenceRequest) return;
        audioStarting = false;
        running = false;
        publishTimerState('idle');
        handleAudioActivationFailure();
      });
  }

  function cancelSequence() {
    sequenceRequest += 1;
    clearAll();
    audioStarting = false;
    running = false;
    publishTimerState('idle');
  }

  function toggleSequence() {
    if (running || audioStarting) cancelSequence(); else startSequence();
  }

  function isEditableTarget(target) {
    return target instanceof HTMLElement && (
      target.isContentEditable ||
      target.tagName === 'INPUT' ||
      target.tagName === 'SELECT' ||
      target.tagName === 'TEXTAREA'
    );
  }

  // Keyboard
  window.addEventListener('keydown', (e) => {
    if (isEditableTarget(e.target)) return;
    if (e.code === 'Space') e.preventDefault();
    if (e.code === 'Space' && !e.repeat) {
      toggleSequence();
      return;
    }
    // Live audition
    if (!e.repeat) {
      if (e.key === 'g' || e.key === 'G') { previewPresetGong(); }
      if (e.code === 'Digit1') { currentPreset = applyPresetDefaults('harder-bronze'); previewPresetGong(); }
      if (e.code === 'Digit2') { currentPreset = applyPresetDefaults('temple-bowl');  previewPresetGong(); }
      if (e.code === 'Digit3') { currentPreset = applyPresetDefaults('wash');          previewPresetGong(); }
    }
  }, { passive:false });

  window.addEventListener('happykasina:togglepractice', () => {
    toggleSequence();
  });

  logRuntimeSettings();
  publishTimerState('idle');
})();
</script>

<script>
(() => {
  const hud = document.getElementById('practice-hud');
  const leadButton = document.getElementById('practice-hud-lead');
  const actionButton = document.getElementById('practice-hud-action');
  const durationButton = document.getElementById('practice-hud-duration');
  const settingsButton = hud.querySelector('.practice-hud-settings');
  const infoButton = hud.querySelector('.practice-hud-info');
  let countdownTimer = null;
  let audioStatusTimer = null;

  const readParams = () => Object.fromEntries(new URLSearchParams(location.search));
  const q = (params, k, d='') => ((params[k] ?? d)).trim();

  const parseDuration = (str, defMs) => {
    if (!str) return defMs;
    const s = str.toLowerCase();
    if (/^\d+$/.test(s)) return Number(s) * 1000;
    let ms = 0, any = false, m;
    const re = /(\d+(?:\.\d+)?)(ms|s|m|h)/g;
    while ((m = re.exec(s))) {
      any = true;
      const v = parseFloat(m[1]);
      const u = m[2];
      ms += (u === 'ms') ? v : (u === 's') ? v * 1000 : (u === 'm') ? v * 60000 : v * 3600000;
    }
    return any ? ms : defMs;
  };

  const parseTimerDuration = (str, defMs) => {
    if (!str) return defMs;
    const s = str.toLowerCase();
    if (/^\d+$/.test(s)) {
      if (s.length <= 2) return Number(s) * 1000;
      return ((Number(s.slice(0, -2)) * 60) + Number(s.slice(-2))) * 1000;
    }
    return parseDuration(s, defMs);
  };

  const formatClock = (ms) => {
    const totalSeconds = Math.max(0, Math.round(ms / 1000));
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = String(totalSeconds % 60).padStart(2, '0');
    return `${minutes}:${seconds}`;
  };

  const formatLead = (ms) => `lead in ${Math.max(0, Math.ceil(ms / 1000))}s`;

  const clearCountdown = () => {
    if (countdownTimer) clearInterval(countdownTimer);
    countdownTimer = null;
  };

  const clearAudioStatus = () => {
    if (audioStatusTimer) clearTimeout(audioStatusTimer);
    audioStatusTimer = null;
  };

  const setHudPhase = (phase, fadeMs = 180) => {
    hud.style.setProperty('--lead-fade-ms', `${Math.max(0, fadeMs)}ms`);
    hud.dataset.state = phase;
  };

  const renderIdle = (params = readParams()) => {
    clearCountdown();
    leadButton.textContent = formatLead(parseTimerDuration(q(params, 'lead'), 3_000));
    actionButton.textContent = 'Space';
    durationButton.textContent = formatClock(parseTimerDuration(q(params, 't'), 10 * 60_000));
    setHudPhase('idle');
  };

  const renderLead = ({ leadMs, mainMs }) => {
    clearAudioStatus();
    clearCountdown();
    const startedAt = performance.now();
    const renderCountdown = () => {
      const elapsed = performance.now() - startedAt;
      leadButton.textContent = formatLead(leadMs - elapsed);
    };
    leadButton.textContent = formatLead(leadMs);
    actionButton.textContent = 'Stop';
    durationButton.textContent = formatClock(mainMs);
    setHudPhase('lead', leadMs);
    renderCountdown();
    countdownTimer = setInterval(renderCountdown, 200);
  };

  const renderRunning = ({ mainMs }) => {
    clearAudioStatus();
    clearCountdown();
    leadButton.textContent = 'lead in 0s';
    actionButton.textContent = 'Stop';
    durationButton.textContent = formatClock(mainMs);
    setHudPhase('hidden');
  };

  const handleTimerState = (event) => {
    const detail = event.detail;
    if (detail.state === 'lead') renderLead(detail);
    if (detail.state === 'running') renderRunning(detail);
    if (detail.state === 'idle') renderIdle();
  };

  const handleAudioStatus = (event) => {
    if (hud.dataset.state !== 'idle') return;
    clearAudioStatus();
    actionButton.textContent = event.detail.state === 'interrupted' ? 'Audio interrupted' : 'Audio unavailable';
    audioStatusTimer = setTimeout(() => renderIdle(), 3200);
  };

  settingsButton.addEventListener('click', () => window.dispatchEvent(new CustomEvent('happykasina:opensettings')));
  infoButton.addEventListener('click', () => window.dispatchEvent(new CustomEvent('happykasina:openinstructions')));
  actionButton.addEventListener('click', () => window.dispatchEvent(new CustomEvent('happykasina:togglepractice')));
  leadButton.addEventListener('click', () => window.dispatchEvent(new CustomEvent('happykasina:opensettings')));
  durationButton.addEventListener('click', () => window.dispatchEvent(new CustomEvent('happykasina:opensettings')));
  window.addEventListener('happykasina:timerstate', handleTimerState);
  window.addEventListener('happykasina:audiostatus', handleAudioStatus);
  window.addEventListener('happykasina:settingschange', (event) => renderIdle(event.detail.params));

  renderIdle();
})();
</script>

    backdrop.addEventListener('keydown', focusTrapHandler);

  function releaseFocus() {
    backdrop.removeEventListener('keydown', focusTrapHandler);
    if (lastFocused && lastFocused.focus) lastFocused.focus();

    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length-1];
    if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
