  function replaceCurrentQuery(sp) {
    const next = new URL(location.href);
    next.search = sp.toString();
    try {
      history.replaceState(null, '', next);
    } catch (error) {
      console.warn('[Kasina Settings] Could not update the address bar.', error);
    }
  }

  $('#ytpanel-apply').addEventListener('click', () => {
    const sp = collectSettingsSearchParams();
    replaceCurrentQuery(sp);
    window.dispatchEvent(new CustomEvent('happykasina:settingschange', {
      detail: { params: Object.fromEntries(sp) }
    }));
    closePanel();
  });

  $('#ytpanel-preview').addEventListener('click', () => {
    const sp = collectSoundPreviewSearchParams();
    window.dispatchEvent(new CustomEvent('happykasina:previewgong', {
      detail: { params: Object.fromEntries(sp) }
    }));
  });

  $('#ytpanel-preview-bell').addEventListener('click', () => {
    const sp = collectBellPreviewSearchParams();
    window.dispatchEvent(new CustomEvent('happykasina:previewbell', {
      detail: { params: Object.fromEntries(sp) }
    }));
  });

  // --- permalink copy ---
  $('#ytpanel-permalink').addEventListener('click', async () => {
    const sp = collectSettingsSearchParams();
    const tmp = new URL(location.href);
    tmp.search = sp.toString();
    try {
      await navigator.clipboard.writeText(tmp.toString());
      const btn = $('#ytpanel-permalink'); const old = btn.textContent;
      btn.textContent = 'Copied!'; setTimeout(() => (btn.textContent = old), 900);
    } catch { prompt('Copy this URL:', tmp.toString()); }
  });
})();
</script>
<script>
(() => {
  const style = document.createElement('style');
  style.textContent = `
    .practice-panel-backdrop { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,0.68); z-index: 9998; }
    .practice-panel { width: min(88vw, 760px); color: #f7f4ed; background: rgba(10,10,10,0.92); border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; box-shadow: 0 20px 70px rgba(0,0,0,0.55); padding: clamp(28px, 5vw, 52px); font: 500 clamp(22px, 3vw, 34px)/1.35 Georgia, 'Times New Roman', serif; text-align: center; }
    .practice-panel p { margin: 0; }
    .practice-panel p + p { margin-top: 0.8em; }
    .practice-panel kbd { display: inline-grid; place-items:center; min-width: 1.35em; padding: 0.04em 0.32em 0.1em; border: 1px solid rgba(255,255,255,0.32); border-radius: 6px; background: rgba(255,255,255,0.08); color: #fff; font: 650 0.95em/1.1 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; vertical-align: 0.03em; }
    .practice-panel .practice-panel-close { margin-top: 1.5em; border: 1px solid rgba(255,255,255,0.24); border-radius: 8px; background: rgba(255,255,255,0.08); color: #f7f4ed; padding: 0.65em 1em; font: 600 15px/1.2 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; cursor: pointer; }
    .practice-panel .practice-panel-close:focus-visible { outline: 2px solid #f7f4ed; outline-offset: 3px; }
  `;
  document.head.appendChild(style);

  const backdrop = document.createElement('div');
  backdrop.className = 'practice-panel-backdrop';
  backdrop.innerHTML = `
    <div class="practice-panel" role="dialog" aria-modal="true" aria-label="Meditation instructions">
      <p>Sit comfortably and rest your gaze on the centre of the coloured disk.</p>
      <p>Let the disk be the whole task; when attention wanders, gently return to its colour and shape.</p>
      <p>When ready, close your eyes and attend to the retained image or afterimage, returning to the disk when it fades.</p>
      <p>Press <kbd>Space</kbd> to start immediately, press <kbd>f</kbd> for settings, or press <kbd>j</kbd> for these instructions.</p>
      <button class="practice-panel-close" type="button">Close</button>
    </div>
  `;
  document.body.appendChild(backdrop);

  const panel = backdrop.querySelector('.practice-panel');
  const closeButton = backdrop.querySelector('.practice-panel-close');
  let lastFocused = null;

  function openPanel() {
    lastFocused = document.activeElement;
    backdrop.style.display = 'grid';
    closeButton.focus();
  }

  function closePanel() {
    backdrop.style.display = 'none';
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  function isEditableTarget(target) {
    return target instanceof HTMLElement && (
      target.isContentEditable ||
      target.tagName === 'INPUT' ||
      target.tagName === 'SELECT' ||
      target.tagName === 'TEXTAREA'
    );
  }

  window.addEventListener('keydown', (e) => {
    if (isEditableTarget(e.target) || backdrop.style.display !== 'grid') return;
    const isInstructionsKey = e.key === 'j' || e.key === 'J' || e.key === 'h' || e.key === 'H' || e.key === '?' || (e.code === 'Slash' && e.shiftKey);
    if (e.code === 'Space' || isInstructionsKey) {
      closePanel();
      return;
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      closePanel();
    }
  }, { capture: true });

  window.addEventListener('keydown', (e) => {
    if (isEditableTarget(e.target)) return;
    const isInstructionsKey = e.key === 'j' || e.key === 'J' || e.key === 'h' || e.key === 'H' || e.key === '?' || (e.code === 'Slash' && e.shiftKey);
    if (isInstructionsKey && backdrop.style.display === 'grid') {
      closePanel();
      return;
    }
    if (isInstructionsKey && !e.repeat) {
      e.preventDefault();
      backdrop.style.display === 'grid' ? closePanel() : openPanel();
      return;
    }
    if (e.key === 'Escape' && backdrop.style.display === 'grid') {
      e.preventDefault();
      closePanel();
    }
  });
  window.addEventListener('happykasina:openinstructions', openPanel);

  closeButton.addEventListener('click', closePanel);
  backdrop.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      closeButton.focus();
    }
  });
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop) closePanel();
  });
  panel.addEventListener('click', (e) => e.stopPropagation());
})();
</script>
</body>
</html>
