<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kasina + FM Gong Timer (Serene Reverb, No UI)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { height: 100%; margin: 0; background:#000; }
    .wrap { height: 100%; display: grid; place-items: center; background:#000; }
    .kasina {
      width: 280px; height: 280px; border-radius: 50%;
      background: #0047AB;
      box-shadow: 0 0 40px rgba(255,255,255,0.06);
      will-change: transform, background, width, height;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="kasina" id="kasina"></div>
  </div>

<script>
(() => {
  // =========================
  // URL params & defaults
  // =========================
  const url = new URL(location.href);
  const q = (k, d='') => (url.searchParams.get(k) ?? d).trim();

  function parseDuration(str, defMs) {
    if (!str) return defMs;
    const s = str.toLowerCase();
    if (/^\d+$/.test(s)) return Number(s) * 1000; // seconds
    let ms = 0, any = false, m;
    const re = /(\d+(?:\.\d+)?)(ms|s|m|h)/g;
    while ((m = re.exec(s))) {
      any = true; const v = parseFloat(m[1]); const u = m[2];
      ms += (u==='ms')? v : (u==='s')? v*1e3 : (u==='m')? v*6e4 : v*36e5;
    }
    return any ? ms : defMs;
  }

  // Practice timers
  const leadMs = parseDuration(q('lead'), 10_000);
  const mainMs = parseDuration(q('t'),    10*60_000);
  const gapMs  = parseDuration(q('gap'),  2_000);

  // Reverb defaults (overridden by preset or URL)
  let revMs  = parseDuration(q('reverb'), 2_500);
  let revMix = Math.max(0, Math.min(1, parseFloat(q('mix') || '0.22')));
  // Chorus flag can be forced by URL
  let chorusForced = q('chorus','').toLowerCase();
  if (chorusForced !== '0' && chorusForced !== '1') chorusForced = '';

  // Visuals
  const presetsColors = { cobalt:'#0047AB', amaranth:'#C41E3A', crimson:'#DC143C', azure:'#007FFF', steel:'#4682B4' };
  const colorParam = q('color','');
  const kasinaColor = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(colorParam)
    ? colorParam
    : (presetsColors[colorParam.toLowerCase()] || '#0047AB');
  const bgColor = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(q('bg')) ? q('bg') : '#000000';
  const diameter = q('d','280px');

  const kasinaEl = document.getElementById('kasina');
  kasinaEl.style.background = kasinaColor;
  kasinaEl.style.width = diameter;
  kasinaEl.style.height = diameter;
  document.body.style.background = bgColor;
  document.querySelector('.wrap').style.background = bgColor;

  // =========================
  // WebAudio core
  // =========================
  let audioCtx = null, convolver = null, revWet = null, revDry = null, wetChainIn = null, wetChainOut = null;

  function ensureCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // Build a simple stereo convolver impulse (exponential noise tail)
  function buildReverb(ctx, decayMs) {
    const rate = ctx.sampleRate;
    const length = Math.max(1, Math.floor(rate * (decayMs/1000)));
    const impulse = ctx.createBuffer(2, length, rate);
    for (let ch=0; ch<2; ch++) {
      const data = impulse.getChannelData(ch);
      for (let i=0; i<length; i++) {
        const t = i / rate;
        const decay = Math.exp(-3.5 * t / (decayMs/1000)); // ~60dB over decayMs
        data[i] = (Math.random()*2 - 1) * decay * 0.6;
      }
      // gentle early reflection
      for (let i=0; i<Math.min(200, length-20); i++) {
        data[i+20] += data[i] * 0.4 * (ch===0 ? 1.0 : 0.8);
      }
    }
    const conv = ctx.createConvolver();
    conv.buffer = impulse;
    return conv;
  }

  // Build a simple stereo chorus block (post-reverb)
  function buildChorus(ctx, { rateL=0.15, rateR=0.20, depthMs=8, delayMs=12, mix=0.35 } = {}) {
    const input = ctx.createGain();
    const dry = ctx.createGain();
    const wet  = ctx.createGain();
    const out  = ctx.createGain();

    dry.gain.value = 1 - mix;
    wet.gain.value = mix;

    const splitter = ctx.createChannelSplitter(2);
    const merger   = ctx.createChannelMerger(2);

    const dl = ctx.createDelay(0.05); // 50ms max is plenty
    const dr = ctx.createDelay(0.05);
    const base = delayMs/1000;
    dl.delayTime.value = base;
    dr.delayTime.value = base;

    const lfoL = ctx.createOscillator(); lfoL.type = 'sine'; lfoL.frequency.value = rateL;
    const lfoR = ctx.createOscillator(); lfoR.type = 'sine'; lfoR.frequency.value = rateR;
    const depthL = ctx.createGain(); depthL.gain.value = depthMs/1000;
    const depthR = ctx.createGain(); depthR.gain.value = depthMs/1000;

    // routing
    input.connect(dry);
    input.connect(splitter);
    splitter.connect(dl, 0);
    splitter.connect(dr, 1);
    dl.connect(merger, 0, 0);
    dr.connect(merger, 0, 1);
    merger.connect(wet);

    // LFO modulation of delay times
    lfoL.connect(depthL); depthL.connect(dl.delayTime);
    lfoR.connect(depthR); depthR.connect(dr.delayTime);
    lfoL.start(); lfoR.start();

    // mix to out
    dry.connect(out);
    wet.connect(out);

    return { input, output: out };
  }

  function ensureReverb({ enableChorus=false, chorusCfg={} } = {}) {
    const ctx = ensureCtx();
    if (!convolver) {
      convolver = buildReverb(ctx, revMs);
      revWet = ctx.createGain();
      revDry = ctx.createGain();
      revWet.gain.value = revMix;
      revDry.gain.value = 1 - revMix;

      // Build wet chain: revWet -> convolver -> [optional chorus] -> wetOut -> destination
      const wetOut = ctx.createGain();
      wetOut.connect(ctx.destination);

      let chain = convolver;
      if (enableChorus) {
        const ch = buildChorus(ctx, chorusCfg);
        convolver.connect(ch.input);
        ch.output.connect(wetOut);
        wetChainIn = revWet; // we still feed the convolver, not chorus directly
      } else {
        convolver.connect(wetOut);
      }

      // Connect inputs
      revWet.connect(convolver);
      revDry.connect(ctx.destination);
    }
    return { ctx, convolver, revWet, revDry };
  }

  // Envelopes
  function ampEnv(gainNode, t0, peak, atk, dec) {
    const g = gainNode.gain;
    g.cancelScheduledValues(t0);
    g.setValueAtTime(1e-5, t0);
    g.exponentialRampToValueAtTime(Math.max(peak,1e-4), t0 + atk);
    g.exponentialRampToValueAtTime(1e-5, t0 + atk + dec);
  }
  function indexEnv(gainNode, t0, indexHz, atk, dec) {
    const g = gainNode.gain;
    g.cancelScheduledValues(t0);
    g.setValueAtTime(1e-3, t0);
    g.exponentialRampToValueAtTime(Math.max(indexHz, 1e-3), t0 + atk);
    g.exponentialRampToValueAtTime(1e-3, t0 + atk + dec);
  }

  // Broadband noise "wash" with slow random AM (mallet roll)
  function addNoiseWash(ctx, master, {
    level=0.25, attack=0.12, decay=12.0, center=1200, q=0.7, hp=180,
    amDepth=0.5, amFreqMin=0.08, amFreqMax=0.25, amJitterEvery=3.0
  } = {}, when=0) {
    const t0 = ctx.currentTime + (when||0);

    // noise buffer
    const noise = ctx.createBufferSource();
    const dur = attack + decay + 2;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i=0;i<data.length;i++) data[i] = Math.random()*2-1;
    noise.buffer = buf; noise.loop = false;

    // filters
    const g = ctx.createGain(); g.gain.value = 0.0;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = center; bp.Q.value = q;
    const hip = ctx.createBiquadFilter(); hip.type = 'highpass'; hip.frequency.value = hp;

    // AM: constant + LFO → sum into gain.gain
    const base = ctx.createConstantSource(); base.offset.value = Math.max(0.001, 1 - amDepth);
    const lfo  = ctx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = amFreqMin;
    const depth = ctx.createGain(); depth.gain.value = amDepth;

    lfo.connect(depth);
    depth.connect(g.gain);
    base.connect(g.gain);
    base.start();

    // Randomize LFO rate over time (slewed)
    function scheduleLfoWander(startT, total) {
      let t = startT, end = startT + total;
      let f = amFreqMin;
      while (t < end) {
        const nextF = amFreqMin + Math.random()*(amFreqMax - amFreqMin);
        lfo.frequency.linearRampToValueAtTime(nextF, t + amJitterEvery);
        t += amJitterEvery;
      }
    }
    scheduleLfoWander(t0, dur);
    lfo.start(t0);

    // route
    noise.connect(hip); hip.connect(bp); bp.connect(g); g.connect(master);

    // envelope
    g.gain.setValueAtTime(1e-5, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(level,1e-4), t0 + attack);
    g.gain.exponentialRampToValueAtTime(1e-5, t0 + attack + decay);

    noise.start(t0);
    noise.stop(t0 + dur + 0.5);
  }

  // FM gong
  function playFMGong({
    when=0, level=0.65, base=220, atk=0.005, dec=6.0, shimmer=true,
    ratioA=2.71, ratioB=4.07, ratioS=9.0, indexA=2.2, indexB=1.4, indexS=0.5,
    aDecay=0.87, bDecay=0.78, sDecay=0.25,
    detuneCents=0, wash=null
  } = {}) {
    const { ctx } = ensureReverb(currentWetChain);
    const t0 = ctx.currentTime + (when||0);

    // Split to dry/wet
    const dry = ctx.createGain();
    const wet = ctx.createGain();
    dry.gain.value = revDry ? revDry.gain.value : 1.0;
    wet.gain.value = revWet ? revWet.gain.value : 0.0;

    if (revDry) dry.connect(ctx.destination); else dry.connect(ctx.destination);
    if (revWet && convolver) wet.connect(revWet);

    // Master
    const master = ctx.createGain();
    master.gain.value = level;
    master.connect(dry);
    if (revWet && convolver) master.connect(wet);

    // Carrier
    const c = ctx.createOscillator();
    c.type = 'sine';
    const detune = (Math.random()*2-1) * detuneCents;
    c.frequency.setValueAtTime(base, t0);
    c.detune.setValueAtTime(detune, t0);

    const cAmp = ctx.createGain();
    cAmp.gain.value = 0.0;
    c.connect(cAmp);
    cAmp.connect(master);
    ampEnv(cAmp, t0, 1.0, atk, dec);

    // Modulator A
    const mA = ctx.createOscillator();
    mA.type = 'sine';
    mA.frequency.setValueAtTime(base * (ratioA + (Math.random()*0.04-0.02)), t0);
    const mAG = ctx.createGain(); mAG.gain.value = 0.0;
    mA.connect(mAG); mAG.connect(c.frequency);
    indexEnv(mAG, t0, base*indexA, 0.002, dec*aDecay);

    // Modulator B
    const mB = ctx.createOscillator();
    mB.type = 'sine';
    mB.frequency.setValueAtTime(base * (ratioB + (Math.random()*0.04-0.02)), t0);
    const mBG = ctx.createGain(); mBG.gain.value = 0.0;
    mB.connect(mBG); mBG.connect(c.frequency);
    indexEnv(mBG, t0, base*indexB, 0.003, dec*bDecay);

    // Shimmer
    let mS, mSG;
    if (shimmer) {
      mS = ctx.createOscillator();
      mS.type = 'sine';
      mS.frequency.setValueAtTime(base * (ratioS + (Math.random()*0.5-0.25)), t0);
      mSG = ctx.createGain(); mSG.gain.value = 0.0;
      mS.connect(mSG); mSG.connect(c.frequency);
      indexEnv(mSG, t0, base*indexS, 0.002, Math.min(1.4, dec*sDecay));
    }

    // Strike accent
    mAG.gain.setTargetAtTime(mAG.gain.value + base*0.8, t0, 0.005);
    mAG.gain.setTargetAtTime(1e-3, t0 + 0.03, 0.02);

    // Optional wash
    if (wash) addNoiseWash(ctx, master, wash, when);

    const stopAt = t0 + dec + 0.8;
    for (const o of [c, mA, mB, mS].filter(Boolean)) { o.start(t0); o.stop(stopAt); }
  }

  // =========================
  // Presets (with longer reverb)
  // =========================
  const PRESETS = {
    'default': {
      label: 'default',
      fm: { base:220, dec:6.0, shimmer:true, ratioA:2.71, ratioB:4.07, ratioS:9.0, indexA:2.2, indexB:1.4, indexS:0.5, detuneCents:2 },
      verb: { revMs: 3000, revMix: 0.26 },
      chorus: { enabled: false }
    },
    'harder-bronze': {
      label: 'harder-bronze',
      fm: { base:220, dec:8.5, shimmer:false, ratioA:2.32, ratioB:3.95, indexA:3.0, indexB:1.8, sDecay:0.18, detuneCents:3 },
      verb: { revMs: 3200, revMix: 0.22 },
      chorus: { enabled: false }
    },
    'temple-bowl': {
      label: 'temple-bowl',
      fm: { base:110, dec:12.0, shimmer:false, ratioA:2.45, ratioB:3.6, indexA:1.6, indexB:1.1, detuneCents:1 },
      verb: { revMs: 5500, revMix: 0.38 },
      chorus: { enabled: true, cfg: { rateL:0.08, rateR:0.11, depthMs:7, delayMs:16, mix:0.22 } }
    },
    'wash': { // Pink Floyd sound-bath
      label: 'wash',
      fm: { base:98, dec:18.0, shimmer:true, ratioA:2.6, ratioB:4.3, ratioS:10.5, indexA:3.4, indexB:2.1, indexS:0.8, aDecay:0.95, bDecay:0.92, detuneCents:6,
            wash: { level:0.5, attack:0.5, decay:18.0, center:1400, q:0.9, hp:160, amDepth:0.55, amFreqMin:0.06, amFreqMax:0.22, amJitterEvery:3.5 } },
      verb: { revMs: 9000, revMix: 0.52 },
      chorus: { enabled: true, cfg: { rateL:0.12, rateR:0.17, depthMs:9, delayMs:14, mix:0.35 } }
    }
  };

  let currentWetChain = { enableChorus:false, chorusCfg:{} };

  function applyPresetDefaults(name) {
    const p = PRESETS[name] || PRESETS['default'];

    // Reverb: preset defaults, then URL overrides
    revMs  = parseDuration(q('reverb'), p.verb.revMs);
    revMix = Math.max(0, Math.min(1, parseFloat(q('mix') || String(p.verb.revMix))));

    // Chorus: from preset, optionally forced by URL
    let enableChorus = !!p.chorus.enabled;
    if (chorusForced === '0') enableChorus = false;
    if (chorusForced === '1') enableChorus = true;
    currentWetChain = { enableChorus, chorusCfg: p.chorus.cfg || {} };

    // Rebuild graph: tear down convolver so ensureReverb recreates chain with new settings
    if (audioCtx) {
      convolver = null; revWet = null; revDry = null; wetChainIn = null;
    }
    ensureReverb(currentWetChain);
    return p;
  }

  // Pick preset from URL
  const presetName = q('preset','default');
  let currentPreset = applyPresetDefaults(presetName);

  // Helper: trigger the gong with current preset
  function triggerPresetGong(extra = {}) {
    const fm = { ...currentPreset.fm, ...extra };
    playFMGong(fm);
  }

  // =========================
  // Timers / controls
  // =========================
  let running = false, leadTimer=null, mainTimer=null;

  function clearAll() {
    if (leadTimer) clearTimeout(leadTimer);
    if (mainTimer) clearTimeout(mainTimer);
    leadTimer = mainTimer = null;
  }

  function startSequence() {
    if (running) return;
    running = true;
    ensureReverb(currentWetChain);

    // Lead-in → intro hit
    leadTimer = setTimeout(() => {
      leadTimer = null;
      const introExtra = (presetName === 'wash')
        ? { level:0.55, dec: currentPreset.fm.dec * 0.6, shimmer:false }
        : { level:0.5,  dec: Math.max(4.0, currentPreset.fm.dec * 0.55), shimmer:false };
      triggerPresetGong(introExtra);

      // After main → two end gongs
      mainTimer = setTimeout(() => {
        mainTimer = null;
        triggerPresetGong({ base: Math.max(40, (currentPreset.fm.base * 0.89)|0), level:0.7 });
        setTimeout(() => triggerPresetGong({ base: currentPreset.fm.base, level:0.7 }), gapMs);
        running = false;
      }, mainMs);
    }, leadMs);
  }

  function cancelSequence() { clearAll(); running = false; }

  // Keyboard
  window.addEventListener('keydown', (e) => {
    // Space: start/stop timer sequence
    if (e.code === 'Space') e.preventDefault();
    if (e.code === 'Space' && !e.repeat) {
      if (!running) startSequence(); else cancelSequence();
      return;
    }
    // Live audition
    if (!e.repeat) {
      if (e.key === 'g' || e.key === 'G') { triggerPresetGong(); }
      if (e.code === 'Digit1') { currentPreset = applyPresetDefaults('harder-bronze'); triggerPresetGong(); }
      if (e.code === 'Digit2') { currentPreset = applyPresetDefaults('temple-bowl');  triggerPresetGong(); }
      if (e.code === 'Digit3') { currentPreset = applyPresetDefaults('wash');          triggerPresetGong(); }
    }
  }, { passive:false });

  console.log('[FM Gong Timer]', {
    leadMs, mainMs, gapMs, reverb: revMs, mix: revMix, color: kasinaColor, bg: bgColor, diameter, preset: presetName,
    chorus: currentWetChain.enableChorus
  });
})();
</script>

<!-- ======== YT-style ? overlay + parameter editor (unchanged UI, adds chorus toggle via URL) ======== -->
<script>
(() => {
  const url = new URL(location.href);
  const q = (k, d='') => (url.searchParams.get(k) ?? d).trim();

  // --- styles ---
  const style = document.createElement('style');
  style.textContent = `
    .ytpanel-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 9999; }
    .ytpanel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(92vw, 560px); background: #111; color: #fff; border: 1px solid #333; border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); font: 14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    .ytpanel header { display:flex; align-items:center; justify-content:space-between;
      padding: 10px 14px; border-bottom: 1px solid #222; background:#141414; border-radius: 10px 10px 0 0; }
    .ytpanel header h3 { margin:0; font-size: 15px; font-weight: 600; }
    .ytpanel .content { padding: 12px 14px; }
    .ytpanel .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
    .ytpanel label { display:flex; flex-direction:column; gap:6px; }
    .ytpanel .k { font-size: 12px; color:#aaa; }
    .ytpanel input, .ytpanel select { background:#0b0b0b; color:#fff; border:1px solid #2a2a2a; border-radius:8px; padding:8px 10px; outline:none; }
    .ytpanel input:focus, .ytpanel select:focus { border-color:#3b82f6; }
    .ytpanel .actions { display:flex; gap:10px; justify-content:flex-end; padding: 10px 14px 14px; border-top: 1px solid #222; }
    .ytpanel button { border:1px solid #2a2a2a; background:#1a1a1a; color:#fff; border-radius:8px; padding:8px 12px; cursor:pointer; }
    .ytpanel button.primary { background:#2563eb; border-color:#2563eb; }
    .ytpanel small.hint { display:block; color:#9aa; margin-top:8px; }
    .ytpill { display:inline-block; padding:2px 8px; border-radius:999px; background:#1e293b; color:#cbd5e1; font-size:12px; }
  `;
  document.head.appendChild(style);

  // --- DOM ---
  const backdrop = document.createElement('div');
  backdrop.className = 'ytpanel-backdrop';
  backdrop.innerHTML = `
    <div class="ytpanel" role="dialog" aria-modal="true" aria-label="Kasina timer settings">
      <header>
        <h3>Quick Help & Settings <span class="ytpill">Press ? to toggle</span></h3>
        <button id="ytpanel-close" aria-label="Close">✕</button>
      </header>
      <div class="content">
        <div style="margin-bottom:10px">
          <div><b>Keyboard:</b> <code>Space</code> starts/stops timer. <code>g</code> plays current preset. <code>1/2/3</code> audition presets (bronze/bowl/wash). <code>?</code> opens this panel. <code>Esc</code> closes.</div>
          <small class="hint">Times accept <code>ms</code>, <code>s</code>, <code>m</code>, <code>h</code> (e.g. <code>90s</code>, <code>2m</code>).</small>
        </div>

        <div class="grid">
          <label>
            <span class="k">Preset (preset)</span>
            <select id="f-preset">
              <option value="default">default</option>
              <option value="harder-bronze">harder-bronze</option>
              <option value="temple-bowl">temple-bowl</option>
              <option value="wash">wash (sound-bath)</option>
            </select>
          </label>

          <label>
            <span class="k">Lead-in (lead)</span>
            <input id="f-lead" placeholder="10s" />
          </label>
          <label>
            <span class="k">Main duration (t)</span>
            <input id="f-t" placeholder="10m" />
          </label>
          <label>
            <span class="k">End gap (gap)</span>
            <input id="f-gap" placeholder="2s" />
          </label>

          <label>
            <span class="k">Reverb decay (reverb)</span>
            <input id="f-reverb" placeholder="3000" />
          </label>
          <label>
            <span class="k">Reverb mix 0–1 (mix)</span>
            <input id="f-mix" placeholder="0.26" />
          </label>

          <label>
            <span class="k">Force chorus 0|1 (chorus)</span>
            <input id="f-chorus" placeholder="" />
          </label>

          <label>
            <span class="k">Kasina color (color)</span>
            <input id="f-color" placeholder="cobalt / #0047AB" />
          </label>
          <label>
            <span class="k">Background (bg)</span>
            <input id="f-bg" placeholder="#000000" />
          </label>
          <label>
            <span class="k">Diameter (d)</span>
            <input id="f-d" placeholder="280px" />
          </label>
        </div>

        <small class="hint">Tip: leave any field blank to remove that param and fall back to preset/default.</small>
      </div>
      <div class="actions">
        <button id="ytpanel-permalink">Copy permalink</button>
        <span style="flex:1"></span>
        <button id="ytpanel-cancel">Cancel</button>
        <button id="ytpanel-apply" class="primary">Apply</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);

  // --- seed current values ---
  const $ = (sel) => backdrop.querySelector(sel);
  const fields = {
    preset: $('#f-preset'),
    lead: $('#f-lead'),
    t: $('#f-t'),
    gap: $('#f-gap'),
    reverb: $('#f-reverb'),
    mix: $('#f-mix'),
    chorus: $('#f-chorus'),
    color: $('#f-color'),
    bg: $('#f-bg'),
    d: $('#f-d'),
  };
  Object.entries(fields).forEach(([k, el]) => { const v = q(k,''); if (v) el.value = v; });
  if (!fields.preset.value) fields.preset.value = 'default';

  // --- panel show/hide + a11y focus trap ---
  function openPanel() { backdrop.style.display = 'block'; trapFocus(); }
  function closePanel() { backdrop.style.display = 'none'; releaseFocus(); }
  let lastFocused = null;
  function trapFocus() {
    lastFocused = document.activeElement;
    const focusables = backdrop.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (focusables.length) focusables[0].focus();
    backdrop.addEventListener('keydown', focusTrapHandler);
  }
  function releaseFocus() {
    backdrop.removeEventListener('keydown', focusTrapHandler);
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }
  function focusTrapHandler(e) {
    if (e.key !== 'Tab') return;
    const focusables = [...backdrop.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(n => !n.disabled);
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length-1];
    if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
  }

  // --- keyboard toggles ---
  window.addEventListener('keydown', (e) => {
    const isQuestion = e.key === '?' || (e.code === 'Slash' && e.shiftKey);
    if (isQuestion) { e.preventDefault(); backdrop.style.display === 'block' ? closePanel() : openPanel(); return; }
    if (e.key === 'Escape' && backdrop.style.display === 'block') { e.preventDefault(); closePanel(); }
  });

  // buttons / click-off
  $('#ytpanel-close').addEventListener('click', closePanel);
  $('#ytpanel-cancel').addEventListener('click', closePanel);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closePanel(); });

  // --- apply: rewrite URL params & reload ---
  function setParam(sp, key, value) {
    const trimmed = (value ?? '').trim();
    if (!trimmed) sp.delete(key); else sp.set(key, trimmed);
  }

  $('#ytpanel-apply').addEventListener('click', () => {
    const sp = new URLSearchParams(location.search);
    setParam(sp, 'preset', fields.preset.value);
    setParam(sp, 'lead', fields.lead.value);
    setParam(sp, 't', fields.t.value);
    setParam(sp, 'gap', fields.gap.value);
    setParam(sp, 'reverb', fields.reverb.value);
    setParam(sp, 'mix', fields.mix.value);
    setParam(sp, 'chorus', fields.chorus.value);
    setParam(sp, 'color', fields.color.value);
    setParam(sp, 'bg', fields.bg.value);
    setParam(sp, 'd', fields.d.value);
    const next = `${location.pathname}?${sp.toString()}`;
    location.replace(next);
  });

  // --- permalink copy ---
  $('#ytpanel-permalink').addEventListener('click', async () => {
    const sp = new URLSearchParams(location.search);
    const tmp = new URL(location.href);
    setParam(sp, 'preset', fields.preset.value);
    setParam(sp, 'lead', fields.lead.value);
    setParam(sp, 't', fields.t.value);
    setParam(sp, 'gap', fields.gap.value);
    setParam(sp, 'reverb', fields.reverb.value);
    setParam(sp, 'mix', fields.mix.value);
    setParam(sp, 'chorus', fields.chorus.value);
    setParam(sp, 'color', fields.color.value);
    setParam(sp, 'bg', fields.bg.value);
    setParam(sp, 'd', fields.d.value);
    tmp.search = sp.toString();
    try {
      await navigator.clipboard.writeText(tmp.toString());
      const btn = $('#ytpanel-permalink'); const old = btn.textContent;
      btn.textContent = 'Copied!'; setTimeout(() => (btn.textContent = old), 900);
    } catch { prompt('Copy this URL:', tmp.toString()); }
  });
})();
</script>
</body>
</html>
