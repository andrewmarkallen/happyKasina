<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kasina + FM Gong Timer (Serene Reverb, No UI)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { height: 100%; margin: 0; background:#000; }
    .wrap { height: 100%; display: grid; place-items: center; background:#000; }
    .kasina {
      width: 280px; height: 280px; border-radius: 50%;
      background: #0047AB; /* cobalt by default */
      box-shadow: 0 0 40px rgba(255,255,255,0.06);
      will-change: transform, background, width, height;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="kasina" id="kasina"></div>
  </div>

<script>
(() => {
  // =========================
  // URL params & defaults
  // =========================
  const url = new URL(location.href);
  const q = (k, d='') => (url.searchParams.get(k) ?? d).trim();

  function parseDuration(str, defMs) {
    if (!str) return defMs;
    const s = str.toLowerCase();
    if (/^\d+$/.test(s)) return Number(s) * 1000; // seconds
    let ms = 0, any = false, m;
    const re = /(\d+(?:\.\d+)?)(ms|s|m|h)/g;
    while ((m = re.exec(s))) {
      any = true; const v = parseFloat(m[1]); const u = m[2];
      ms += (u==='ms')? v : (u==='s')? v*1e3 : (u==='m')? v*6e4 : v*36e5;
    }
    return any ? ms : defMs;
  }

  // Your original defaults (“initial practice”)
  const leadMs = parseDuration(q('lead'), 10_000);        // 10s
  const mainMs = parseDuration(q('t'),    10*60_000);     // 10m
  const gapMs  = parseDuration(q('gap'),  2_000);         // 2s

  // Reverb defaults: serene room
  const revMs  = parseDuration(q('reverb'), 2_500);       // 2.5s decay (0 disables)
  const revMix = Math.max(0, Math.min(1, parseFloat(q('mix') || '0.22'))); // gentle ~ -12 dB

  const presets = { cobalt:'#0047AB', amaranth:'#C41E3A', crimson:'#DC143C', azure:'#007FFF', steel:'#4682B4' };
  const colorParam = q('color','');
  const kasinaColor = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(colorParam)
    ? colorParam
    : (presets[colorParam.toLowerCase()] || '#0047AB');   // cobalt default
  const bgColor = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(q('bg')) ? q('bg') : '#000000';
  const diameter = q('d','280px');                        // 280px default

  // Apply visuals
  const kasinaEl = document.getElementById('kasina');
  kasinaEl.style.background = kasinaColor;
  kasinaEl.style.width = diameter;
  kasinaEl.style.height = diameter;
  document.body.style.background = bgColor;
  document.querySelector('.wrap').style.background = bgColor;

  // =========================
  // WebAudio: FM gong + reverb
  // =========================
  let audioCtx = null, reverbNode = null, revWet = null, revDry = null;

  function ensureCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // Build a simple stereo convolver impulse on the fly (exponential noise tail)
  function buildReverb(ctx, decayMs) {
    const rate = ctx.sampleRate;
    const length = Math.max(1, Math.floor(rate * (decayMs/1000)));
    const impulse = ctx.createBuffer(2, length, rate);
    for (let ch=0; ch<2; ch++) {
      const data = impulse.getChannelData(ch);
      for (let i=0; i<length; i++) {
        // White noise * exp-decay. Small predelay-ish headroom.
        const t = i / rate;
        const decay = Math.exp(-3.5 * t / (decayMs/1000)); // 60dB-ish over decayMs
        data[i] = (Math.random()*2 - 1) * decay * 0.6;
      }
      // Add a tap to create a gentle early reflection spread
      for (let i=0; i<Math.min(200, length-20); i++) {
        data[i+20] += data[i] * 0.4 * (ch===0 ? 1.0 : 0.8);
      }
    }
    const convolver = ctx.createConvolver();
    convolver.buffer = impulse;
    return convolver;
  }

  function ensureReverb() {
    const ctx = ensureCtx();
    if (!reverbNode && revMs > 0) {
      reverbNode = buildReverb(ctx, revMs);
      revWet = ctx.createGain();
      revDry = ctx.createGain();
      revWet.gain.value = revMix;        // wet mix
      revDry.gain.value = 1 - revMix;    // dry mix
      // Fan-in targets will connect to revDry & revWet; then to destination
      const wetOut = ctx.createGain();
      reverbNode.connect(wetOut);
      wetOut.connect(ctx.destination);
      revWet.connect(reverbNode);
      revDry.connect(ctx.destination);
    }
    return { ctx, reverbNode, revWet, revDry };
  }

  // Utility: exponential-ish amp envelope
  function ampEnv(gainNode, t0, peak, atk, dec) {
    const g = gainNode.gain;
    g.cancelScheduledValues(t0);
    g.setValueAtTime(1e-5, t0);
    g.exponentialRampToValueAtTime(Math.max(peak,1e-4), t0 + atk);
    g.exponentialRampToValueAtTime(1e-5, t0 + atk + dec);
  }
  // Utility: index envelope for FM (gain driving frequency AudioParam)
  function indexEnv(gainNode, t0, indexHz, atk, dec) {
    const g = gainNode.gain;
    g.cancelScheduledValues(t0);
    g.setValueAtTime(1e-3, t0);
    g.exponentialRampToValueAtTime(Math.max(indexHz, 1e-3), t0 + atk);
    g.exponentialRampToValueAtTime(1e-3, t0 + atk + dec);
  }

  // FM gong (multi-operator, decaying indexes), routed through reverb send
  function playFMGong({when=0, level=0.65, base=220, atk=0.005, dec=6.0, shimmer=true} = {}) {
    const { ctx } = ensureReverb();
    const t0 = ctx.currentTime + (when||0);

    // Split to dry/wet
    const dry = ctx.createGain();
    const wet = ctx.createGain();
    dry.gain.value = revDry ? revDry.gain.value : 1.0;
    wet.gain.value = revWet ? revWet.gain.value : 0.0;

    if (revDry) dry.connect(ctx.destination); else dry.connect(ctx.destination);
    if (revWet && reverbNode) wet.connect(revWet); // send to reverb input

    // Master before split
    const master = ctx.createGain();
    master.gain.value = level;
    master.connect(dry);
    if (revWet && reverbNode) master.connect(wet);

    // Carrier
    const c = ctx.createOscillator();
    c.type = 'sine';
    c.frequency.setValueAtTime(base, t0);

    const cAmp = ctx.createGain();
    cAmp.gain.value = 0.0;
    c.connect(cAmp);
    cAmp.connect(master);
    ampEnv(cAmp, t0, 1.0, atk, dec);

    // Modulator A (ratio ≈ e)
    const mA = ctx.createOscillator();
    mA.type = 'sine';
    mA.frequency.setValueAtTime(base * (2.71 + (Math.random()*0.04-0.02)), t0);
    const mAG = ctx.createGain(); mAG.gain.value = 0.0;
    mA.connect(mAG); mAG.connect(c.frequency);
    indexEnv(mAG, t0, base*2.2, 0.002, dec*0.87);

    // Modulator B (another inharmonic)
    const mB = ctx.createOscillator();
    mB.type = 'sine';
    mB.frequency.setValueAtTime(base * (4.07 + (Math.random()*0.04-0.02)), t0);
    const mBG = ctx.createGain(); mBG.gain.value = 0.0;
    mB.connect(mBG); mBG.connect(c.frequency);
    indexEnv(mBG, t0, base*1.4, 0.003, dec*0.78);

    // Optional shimmer (quick)
    let mS, mSG;
    if (shimmer) {
      mS = ctx.createOscillator();
      mS.type = 'sine';
      mS.frequency.setValueAtTime(base * (9.0 + (Math.random()*0.5-0.25)), t0);
      mSG = ctx.createGain(); mSG.gain.value = 0.0;
      mS.connect(mSG); mSG.connect(c.frequency);
      indexEnv(mSG, t0, base*0.5, 0.002, Math.min(1.4, dec*0.25));
    }

    // Strike accent (very short)
    mAG.gain.setTargetAtTime(mAG.gain.value + base*0.8, t0, 0.005);
    mAG.gain.setTargetAtTime(1e-3, t0 + 0.03, 0.02);

    // Start/stop
    const stopAt = t0 + dec + 0.6;
    for (const o of [c, mA, mB, mS].filter(Boolean)) { o.start(t0); o.stop(stopAt); }
  }

  // =========================
  // Timers / controls
  // =========================
  let running = false, leadTimer=null, mainTimer=null;

  function clearAll() {
    if (leadTimer) clearTimeout(leadTimer);
    if (mainTimer) clearTimeout(mainTimer);
    leadTimer = mainTimer = null;
  }

  function startSequence() {
    if (running) return;
    running = true;
    const { ctx, reverbNode } = ensureReverb();
    // If reverb was requested but not built yet (revMs == 0 => dry only)
    if (reverbNode == null && revMs > 0) ensureReverb();

    // Lead-in → start gong
    leadTimer = setTimeout(() => {
      leadTimer = null;
      playFMGong({ level:0.5, base:220, dec:4.5, shimmer:false });

      // Main → two end gongs
      mainTimer = setTimeout(() => {
        mainTimer = null;
        playFMGong({ level:0.65, base:196, dec:6.2, shimmer:true });
        setTimeout(() => playFMGong({ level:0.65, base:220, dec:6.2, shimmer:true }), gapMs);
        running = false;
      }, mainMs);
    }, leadMs);
  }

  function cancelSequence() { clearAll(); running = false; }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') e.preventDefault();
    if (e.code === 'Space' && !e.repeat) {
      if (!running) startSequence(); else cancelSequence();
    }
  }, { passive:false });

  console.log('[FM Gong Timer]', {
    leadMs, mainMs, gapMs, reverb: revMs, mix: revMix, color: kasinaColor, bg: bgColor, diameter
  });
})();
</script>

<!-- ======== YT-style ? overlay + parameter editor ======== -->
<script>
(() => {
  // reuse helpers safely in this IIFE
  const url = new URL(location.href);
  const q = (k, d='') => (url.searchParams.get(k) ?? d).trim();

  // --- styles ---
  const style = document.createElement('style');
  style.textContent = `
    .ytpanel-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: none; z-index: 9999;
    }
    .ytpanel {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(92vw, 560px);
      background: #111; color: #fff; border: 1px solid #333; border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .ytpanel header {
      display:flex; align-items:center; justify-content:space-between;
      padding: 10px 14px; border-bottom: 1px solid #222; background:#141414; border-radius: 10px 10px 0 0;
    }
    .ytpanel header h3 { margin:0; font-size: 15px; font-weight: 600; }
    .ytpanel .content { padding: 12px 14px; }
    .ytpanel .grid {
      display:grid; grid-template-columns: 1fr 1fr; gap: 10px 12px;
    }
    .ytpanel label { display:flex; flex-direction:column; gap:6px; }
    .ytpanel .k { font-size: 12px; color:#aaa; }
    .ytpanel input, .ytpanel select {
      background:#0b0b0b; color:#fff; border:1px solid #2a2a2a;
      border-radius:8px; padding:8px 10px; outline:none;
    }
    .ytpanel input:focus, .ytpanel select:focus { border-color:#3b82f6; }
    .ytpanel .actions {
      display:flex; gap:10px; justify-content:flex-end; padding: 10px 14px 14px;
      border-top: 1px solid #222;
    }
    .ytpanel button {
      border:1px solid #2a2a2a; background:#1a1a1a; color:#fff; border-radius:8px; padding:8px 12px; cursor:pointer;
    }
    .ytpanel button.primary { background:#2563eb; border-color:#2563eb; }
    .ytpanel small.hint { display:block; color:#9aa; margin-top:8px; }
    .ytpill {
      display:inline-block; padding:2px 8px; border-radius:999px; background:#1e293b; color:#cbd5e1; font-size:12px;
    }
  `;
  document.head.appendChild(style);

  // --- DOM ---
  const backdrop = document.createElement('div');
  backdrop.className = 'ytpanel-backdrop';
  backdrop.innerHTML = `
    <div class="ytpanel" role="dialog" aria-modal="true" aria-label="Kasina timer settings">
      <header>
        <h3>Quick Help & Settings <span class="ytpill">Press ? to toggle</span></h3>
        <button id="ytpanel-close" aria-label="Close">✕</button>
      </header>
      <div class="content">
        <div style="margin-bottom:10px">
          <div><b>Keyboard:</b> <code>Space</code> starts/stops. <code>?</code> opens/closes this panel. <code>Esc</code> closes.</div>
          <small class="hint">Times accept <code>ms</code>, <code>s</code>, <code>m</code>, <code>h</code> (e.g. <code>90s</code>, <code>2m</code>).</small>
        </div>

        <div class="grid">
          <label>
            <span class="k">Lead-in (lead)</span>
            <input id="f-lead" placeholder="10s" />
          </label>
          <label>
            <span class="k">Main duration (t)</span>
            <input id="f-t" placeholder="10m" />
          </label>
          <label>
            <span class="k">End gap (gap)</span>
            <input id="f-gap" placeholder="2s" />
          </label>
          <label>
            <span class="k">Reverb decay (reverb)</span>
            <input id="f-reverb" placeholder="2500" />
          </label>
          <label>
            <span class="k">Reverb mix 0–1 (mix)</span>
            <input id="f-mix" placeholder="0.22" />
          </label>
          <label>
            <span class="k">Kasina color (color)</span>
            <input id="f-color" placeholder="cobalt / #0047AB" />
          </label>
          <label>
            <span class="k">Background (bg)</span>
            <input id="f-bg" placeholder="#000000" />
          </label>
          <label>
            <span class="k">Diameter (d)</span>
            <input id="f-d" placeholder="280px" />
          </label>
        </div>

        <small class="hint">Tip: leave any field blank to remove that param and fall back to default.</small>
      </div>
      <div class="actions">
        <button id="ytpanel-permalink">Copy permalink</button>
        <span style="flex:1"></span>
        <button id="ytpanel-cancel">Cancel</button>
        <button id="ytpanel-apply" class="primary">Apply</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);

  // --- seed current values ---
  const $ = (sel) => backdrop.querySelector(sel);
  const fields = {
    lead: $('#f-lead'),
    t: $('#f-t'),
    gap: $('#f-gap'),
    reverb: $('#f-reverb'),
    mix: $('#f-mix'),
    color: $('#f-color'),
    bg: $('#f-bg'),
    d: $('#f-d'),
  };
  Object.entries(fields).forEach(([k, el]) => { const v = q(k,''); if (v) el.value = v; });

  // --- panel show/hide ---
  function openPanel() { backdrop.style.display = 'block'; trapFocus(); }
  function closePanel() { backdrop.style.display = 'none'; releaseFocus(); }

  let lastFocused = null;
  function trapFocus() {
    lastFocused = document.activeElement;
    const focusables = backdrop.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (focusables.length) focusables[0].focus();
    backdrop.addEventListener('keydown', focusTrapHandler);
  }
  function releaseFocus() {
    backdrop.removeEventListener('keydown', focusTrapHandler);
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }
  function focusTrapHandler(e) {
    if (e.key !== 'Tab') return;
    const focusables = [...backdrop.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(n => !n.disabled);
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length-1];
    if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
  }

  // --- keyboard toggles ---
  window.addEventListener('keydown', (e) => {
    const isQuestion = e.key === '?' || (e.code === 'Slash' && e.shiftKey);
    if (isQuestion) {
      e.preventDefault();
      backdrop.style.display === 'block' ? closePanel() : openPanel();
      return;
    }
    if (e.key === 'Escape' && backdrop.style.display === 'block') {
      e.preventDefault();
      closePanel();
    }
  });

  // buttons / click-off
  $('#ytpanel-close').addEventListener('click', closePanel);
  $('#ytpanel-cancel').addEventListener('click', closePanel);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closePanel(); });

  // --- apply: rewrite URL params & reload ---
  function setParam(sp, key, value) {
    const trimmed = (value ?? '').trim();
    if (!trimmed) sp.delete(key); else sp.set(key, trimmed);
  }

  $('#ytpanel-apply').addEventListener('click', () => {
    const sp = new URLSearchParams(location.search);
    setParam(sp, 'lead', fields.lead.value);
    setParam(sp, 't', fields.t.value);
    setParam(sp, 'gap', fields.gap.value);
    setParam(sp, 'reverb', fields.reverb.value);
    setParam(sp, 'mix', fields.mix.value);
    setParam(sp, 'color', fields.color.value);
    setParam(sp, 'bg', fields.bg.value);
    setParam(sp, 'd', fields.d.value);

    const next = `${location.pathname}?${sp.toString()}`;
    location.replace(next); // avoids history spam
  });

  // --- permalink copy ---
  $('#ytpanel-permalink').addEventListener('click', async () => {
    const sp = new URLSearchParams(location.search);
    const tmp = new URL(location.href);
    setParam(sp, 'lead', fields.lead.value);
    setParam(sp, 't', fields.t.value);
    setParam(sp, 'gap', fields.gap.value);
    setParam(sp, 'reverb', fields.reverb.value);
    setParam(sp, 'mix', fields.mix.value);
    setParam(sp, 'color', fields.color.value);
    setParam(sp, 'bg', fields.bg.value);
    setParam(sp, 'd', fields.d.value);
    tmp.search = sp.toString();
    try {
      await navigator.clipboard.writeText(tmp.toString());
      const btn = $('#ytpanel-permalink');
      const old = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => (btn.textContent = old), 900);
    } catch {
      prompt('Copy this URL:', tmp.toString());
    }
  });
})();
</script>
</body>
</html>
